<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbo Viral</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0f1a; }
  canvas { display: block; }

  #zoneText {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: 'Inter', Arial Black, sans-serif; font-size: 72px; font-weight: 900;
    color: #fff; text-shadow: 0 0 30px rgba(255,255,255,0.8);
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    letter-spacing: 4px; pointer-events: none;
  }
  #zoneText.show { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }

  #speedHUD {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    width: 60%; max-width: 400px; height: 8px; background: rgba(255,255,255,0.2);
    border-radius: 10px; overflow: hidden; backdrop-filter: blur(10px);
  }
  #speedFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4dabf7, #ff6b6b);
    transition: width 0.1s; border-radius: 10px;
  }
  #speedLabel {
    position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
    color: #fff; font-family: 'Inter', sans-serif; font-size: 14px;
    letter-spacing: 2px; opacity: 0.8;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body>
<div id="zoneText"></div>
<div id="speedLabel">VELOCITÀ</div>
<div id="speedHUD"><div id="speedFill"></div></div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// --- Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a0f1a');
scene.fog = new THREE.Fog('#0a0f1a', 30, 80);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0x445566, 0.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(20, 40, 15);
sun.castShadow = true;
scene.add(sun);

// --- Terrain Height Function COMPLETA ---
function terrainHeight(x, z) {
  if (Math.abs(x) > 40 || Math.abs(z) > 40) return 0;
  let y = 0;

  // 1. CUCCIA - centro
  const d0 = Math.hypot(x, z);
  if (d0 < 8) {
    y += -2.5 * 0.5 * (1 + Math.cos(Math.PI * d0 / 8));
  }

  // 2. ACCELERATORE -20,0 [BUG FIX: dxa definito ora]
  const ax = -20, az = 0;
  const dxa = x - ax, dza = z - az;
  const Wa = 8, Da = 4, La = 7.5, soft = 2;
  if (Math.abs(dxa) < Wa/2 + 0.5 && Math.abs(dza) < La + soft) {
    const tx = Math.abs(dxa) / (Wa/2);
    if (tx < 1) {
      let yc = -Da * 0.5 * (1 + Math.cos(Math.PI * tx));
      let fade = 1;
      const adz = Math.abs(dza);
      if (adz > La - soft) fade = 0.5 * (1 + Math.cos(Math.PI * (adz - (La - soft)) / soft));
      if (adz > La) fade *= 0.5 * (1 + Math.cos(Math.PI * Math.min((adz - La)/soft,1)));
      y += yc * fade;
    }
  }

  // 3. VORTICE 20,-15
  const vx = 20, vz = -15;
  const dvx = x - vx, dvz = z - vz;
  const dv = Math.hypot(dvx, dvz);
  const Rv = 7, Dv = 3.5;
  if (dv < Rv) {
    let base = -Dv * 0.5 * (1 + Math.cos(Math.PI * dv / Rv));
    const theta = Math.atan2(dvz, dvx);
    const spiral = 0.22 * (1 - dv/Rv) * Math.sin(4 * theta + dv * 2.2);
    y += base + spiral;
  }

  // 4. ONDE 0,20
  const ox = 0, oz = 20;
  const dox = x - ox, doz = z - oz;
  if (Math.abs(dox) < 12 && Math.abs(doz) < 20) {
    const envX = 0.5 * (1 + Math.cos(Math.PI * dox / 12));
    const envZ = 0.5 * (1 + Math.cos(Math.PI * doz / 20));
    const wave = 1.5 * Math.sin((2 * Math.PI * doz) / 8);
    y += wave * envX * envZ;
  }

  // 5. DOSSO PARABOLICO -15,15 [RIAGGIUNTO]
  const px = -15, pz = 15;
  const dpx = x - px, dpz = z - pz;
  const dp = Math.hypot(dpx, dpz);
  const Rp = 4.5, Hp = 1.15;
  if (dp < Rp) {
    let base = Hp * 0.5 * (1 + Math.cos(Math.PI * dp / Rp));
    const dirx = 0.707, dirz = -0.707;
    const proj = (dpx * dirx + dpz * dirz) / Rp;
    const tilt = 1 + 0.28 * proj;
    y += base * tilt;
  }

  // 6. BUMPS MORBIDI [RIAGGIUNTI]
  const bumps = [[10,10],[-10,-12],[25,5],[-25,-5],[5,-25],[-5,25],[18,12],[-22,18]];
  const Rb = 1.5, Hb = 0.62;
  for (const b of bumps) {
    const bdx = x - b[0], bdz = z - b[1];
    const bd = Math.hypot(bdx, bdz);
    if (bd < Rb) y += Hb * 0.5 * (1 + Math.cos(Math.PI * bd / Rb));
  }

  return y;
}

// --- Build Ground ---
const GRID = 129, SIZE = 80, STEP = SIZE / (GRID - 1);
const heightMatrix = [];
for (let ix = 0; ix < GRID; ix++) {
  heightMatrix[ix] = [];
  for (let iz = 0; iz < GRID; iz++) {
    const x = -40 + ix * STEP, z = -40 + iz * STEP;
    heightMatrix[ix][iz] = terrainHeight(x, z);
  }
}

const geo = new THREE.PlaneGeometry(SIZE, SIZE, GRID - 1, GRID - 1);
geo.rotateX(-Math.PI / 2);
const pos = geo.attributes.position;

// Colori per zona
const colors = {
  cuccia: new THREE.Color(0x4dabf7),
  acceleratore: new THREE.Color(0xff6b6b),
  vortice: new THREE.Color(0x845ef7),
  onde: new THREE.Color(0x20c997),
  dosso: new THREE.Color(0xffa94d),
  piano: new THREE.Color(0x1a2332)
};

const colorAttr = [];
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const y = terrainHeight(x, z);
  pos.setY(i, y);

  let col = colors.piano.clone();
  if (Math.hypot(x, z) < 8) col = colors.cuccia.clone();
  else if (Math.abs(x + 20) < 4 && Math.abs(z) < 7.5) col = colors.acceleratore.clone();
  else if (Math.hypot(x - 20, z + 15) < 7) col = colors.vortice.clone();
  else if (Math.abs(x) < 12 && Math.abs(z - 20) < 20) col = colors.onde.clone();
  else if (Math.hypot(x + 15, z - 15) < 4.5) col = colors.dosso.clone();

  col.lerp(new THREE.Color(0xffffff), Math.max(0, Math.min(0.4, (y + 3) / 6 * 0.4)));
  colorAttr.push(col.r, col.g, col.b);
}
geo.setAttribute('color', new THREE.Float32BufferAttribute(colorAttr, 3));
geo.computeVertexNormals();

const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.7 }));
ground.receiveShadow = true;
scene.add(ground);

// Physics
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
const groundPhysMat = new CANNON.Material('ground');
const hfShape = new CANNON.Heightfield(heightMatrix, { elementSize: STEP });
const hfBody = new CANNON.Body({ mass: 0, material: groundPhysMat });
hfBody.addShape(hfShape);
hfBody.position.set(-40, 0, -40);
world.addBody(hfBody);

// --- ORBO ---
const orboRadius = 0.6;
const orboPhysMat = new CANNON.Material('orbo');
world.addContactMaterial(new CANNON.ContactMaterial(groundPhysMat, orboPhysMat, { friction: 0.005, restitution: 0.18 }));

const orboBody = new CANNON.Body({
  mass: 1, shape: new CANNON.Sphere(orboRadius),
  material: orboPhysMat,
  position: new CANNON.Vec3(6, 3, 0),
  linearDamping: 0.01, angularDamping: 0.01
});
world.addBody(orboBody);

const orboTexture = new THREE.TextureLoader().load('orbo.png');
const orbo = new THREE.Group();
const core = new THREE.Mesh(
  new THREE.SphereGeometry(orboRadius, 32, 32),
  new THREE.MeshStandardMaterial({
    map: orboTexture,
    emissive: 0x000,
    emissiveIntensity: 0
  })
);
core.castShadow = true;
orbo.add(core);

// Occhi
const eyes = new THREE.Group();
eyes.position.y = 0.18;
const eyeGeo = new THREE.SphereGeometry(0.12, 16, 16);
const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111 });
const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
eyeL.position.set(-0.18, 0, 0.45);
const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), pupilMat);
pupilL.position.z = 0.08;
eyeL.add(pupilL);
const eyeR = eyeL.clone();
eyeR.position.x = 0.18;
eyes.add(eyeL, eyeR);
orbo.add(eyes);
scene.add(orbo);

// --- Trail System ---
const trailPoints = [];
const trailMat = new THREE.LineBasicMaterial({
  color: 0xff7a00,
  transparent: true,
  opacity: 0.8,
  linewidth: 3
});
const trailGeo = new THREE.BufferGeometry();
const trailLine = new THREE.Line(trailGeo, trailMat);
scene.add(trailLine);

// --- Particle System ---
const particles = [];
function createParticles(pos, color, count=15) {
  for(let i=0; i<count; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 6, 6),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
    );
    p.position.copy(pos);
    p.velocity = new THREE.Vector3(
      (Math.random()-0.5)*3,
      Math.random()*2,
      (Math.random()-0.5)*3
    );
    p.life = 1.0;
    scene.add(p);
    particles.push(p);
  }
}

// --- Zone Detection ---
let currentZone = '';
const zoneText = document.getElementById('zoneText');

function showZone(name, color) {
  if (currentZone === name) return;
  currentZone = name;
  zoneText.textContent = name.toUpperCase() + '!';
  zoneText.style.color = color;
  zoneText.classList.add('show');
  setTimeout(() => zoneText.classList.remove('show'), 1500);
}

function getZone(x, z) {
  if (Math.hypot(x, z) < 8) return { name: 'CUCCIA', color: '#4dabf7' };
  if (Math.abs(x + 20) < 4 && Math.abs(z) < 7.5) return { name: 'ACCELERATORE', color: '#ff6b6b' };
  if (Math.hypot(x - 20, z + 15) < 7) return { name: 'VORTICE', color: '#845ef7' };
  if (Math.abs(x) < 12 && Math.abs(z - 20) < 20) return { name: 'ONDE', color: '#20c997' };
  if (Math.hypot(x + 15, z - 15) < 4.5) return { name: 'DOSSO', color: '#ffa94d' };
  return { name: '', color: '#fff' };
}

// --- AI ---
const features = [
  { x: 0, z: 0 }, { x: -20, z: 0 }, { x: 20, z: -15 }, { x: 0, z: 20 }, { x: -15, z: 15 }
];
let target = features[1], lastSwitch = 0;

function aiUpdate(dt) {
  const pos = orboBody.position;
  const dx = target.x - pos.x, dz = target.z - pos.z;
  const dist = Math.hypot(dx, dz);

  if (dist > 0.5) {
    orboBody.applyForce(new CANNON.Vec3((dx/dist) * 4, 0, (dz/dist) * 4));
  }

  if (performance.now() - lastSwitch > 4000) {
    target = features[Math.floor(Math.random() * features.length)];
    lastSwitch = performance.now();
  }
}

// --- Main Loop ---
let lastTime = performance.now() / 1000;
const prevPos = new THREE.Vector3();

function animate() {
  const t = performance.now() / 1000;
  const dt = Math.min(0.033, t - lastTime);
  lastTime = t;

  aiUpdate(dt);
  world.step(1/60, dt, 3);

  // Sync Orbo
  orbo.position.copy(orboBody.position);

  // Rotolamento realistico
  const delta = new THREE.Vector3(
    orboBody.position.x - prevPos.x,
    0,
    orboBody.position.z - prevPos.z
  );
  const dist = delta.length();
  if (dist > 0.001) {
    const axis = new THREE.Vector3(-delta.z, 0, delta.x).normalize();
    const angle = dist / orboRadius;
    const dq = new THREE.Quaternion().setFromAxisAngle(axis, angle);
    core.quaternion.premultiply(dq);
  }
  prevPos.copy(orboBody.position);

  const speed = Math.hypot(orboBody.velocity.x, orboBody.velocity.z);
  const zone = getZone(orboBody.position.x, orboBody.position.z);

  // 1. PERSONALITÀ ORBO
  if (zone.name === 'ACCELERATORE') {
    core.material.emissive.setHex(0xff3300);
    core.material.emissiveIntensity = 0.5;
    if (Math.random() < 0.3) createParticles(orbo.position, 0xff6b6b, 5);
  } else if (zone.name === 'CUCCIA') {
    core.material.emissive.setHex(0x4dabf7);
    core.material.emissiveIntensity = 0.3;
    core.scale.setScalar(1 + Math.sin(t * 2) * 0.05);
    if (Math.random() < 0.05) createParticles(orbo.position.clone().add(new THREE.Vector3(0,0.8,0)), 0xffffff, 1);
  } else if (zone.name === 'VORTICE') {
    orbo.rotation.y += 0.15;
    core.material.emissive.setHex(0x845ef7);
    core.material.emissiveIntensity = 0.4;
  } else {
    core.material.emissiveIntensity = 0;
    core.scale.setScalar(1);
  }

  // 2. CAMERA DINAMICA
  let camDist = 15, camHeight = 12;
  if (speed > 6) {
    camDist = 8; camHeight = 6;
  }
  if (zone.name === 'VORTICE') {
    camDist = 10; camHeight = 8;
  }

  const lookDir = new THREE.Vector3(orboBody.velocity.x, 0, orboBody.velocity.z).normalize();
  const camTarget = new THREE.Vector3(
    orbo.position.x - lookDir.x * camDist,
    orbo.position.y + camHeight,
    orbo.position.z - lookDir.z * camDist
  );
  camera.position.lerp(camTarget, 0.08);
  camera.lookAt(orbo.position);

  // 3. TRAIL LUMINOSO
  trailPoints.push(orbo.position.clone());
  if (trailPoints.length > 50) trailPoints.shift();
  trailGeo.setFromPoints(trailPoints);
  trailMat.opacity = Math.max(0, trailMat.opacity - 0.02);
  if (trailPoints.length < 10) trailMat.opacity = 0.8;

  // 4. PARTICELLE PER ZONA
  if (zone.name === 'ACCELERATORE' && speed > 3) {
    createParticles(orbo.position, 0xff6b6b, 8);
  }
  if (zone.name === 'ONDE' && Math.abs(orboBody.velocity.y) > 0.5) {
    createParticles(orbo.position, 0x20c997, 10);
  }

  // Aggiorna particelle
  for(let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.position.add(p.velocity.clone().multiplyScalar(dt));
    p.velocity.y -= 9.82 * dt;
    p.life -= dt * 2;
    p.material.opacity = p.life;
    if (p.life <= 0) {
      scene.remove(p);
      particles.splice(i, 1);
    }
  }

  // 5. HUD
  document.getElementById('speedFill').style.width = Math.min(speed * 10, 100) + '%';
  if (zone.name) showZone(zone.name, zone.color);

  // Reset se cade
  if (orboBody.position.y < -8) {
    orboBody.position.set(6, 3, 0);
    orboBody.velocity.set(0,0,0);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
