<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORBO - Esploratore Curioso</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e8f4ff;font-family:system-ui}
  canvas{display:block;width:100%;height:100%}
  #title{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:#1a1a1a;font-weight:400;letter-spacing:.2em;text-transform:uppercase;font-size:14px;background:rgba(255,255,255,.85);padding:10px 20px;border-radius:999px;backdrop-filter:blur(10px)}
</style>
</head>
<body>
<div id="title">ORBO - Paradiso delle Curve</div>
<canvas id="c"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/+esm"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as CANNON from 'cannon-es';

// --- RENDERER ---
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0xe8f4ff, 1);

// --- SCENA ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8f4ff);
scene.fog = new THREE.Fog(0xe8f4ff, 25, 90);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(12, 10, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// --- LUCI ---
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
dirLight.position.set(15, 20, 15);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
scene.add(dirLight);

// --- MATERIALI ---
const orboTexture = new THREE.TextureLoader().load('orbo.png'); // Metti l'immagine qui
orboTexture.colorSpace = THREE.SRGBColorSpace;

const materialOrbo = new THREE.MeshStandardMaterial({
  map: orboTexture,
  roughness: 0.4,
  metalness: 0,
  emissive: 0x221100,
  emissiveIntensity: 0.1
});

const materialGround = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.75,
  metalness: 0
});

// --- FISICA ---
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);

const matGround = new CANNON.Material('ground');
const matOrbo = new CANNON.Material('orbo');
world.addContactMaterial(new CANNON.ContactMaterial(matGround, matOrbo, {
  friction: 0.01,
  restitution: 0.1
}));

// --- TERRENO SCOLPITO: 3 LIVELLI ---
const waveSize = 60;
const waveSegments = 60;
const groundGeo = new THREE.PlaneGeometry(waveSize, waveSize, waveSegments, waveSegments);
const groundVertices = groundGeo.attributes.position.array;

// MACRO: Mega Bowl centrale
for(let i = 0; i < groundVertices.length; i += 3) {
  const x = groundVertices[i];
  const z = groundVertices[i+2];
  const dist = Math.hypot(x, z);
  if(dist < 12){
    const t = 1 - dist / 12;
    groundVertices[i+1] -= t * t * 8;
  }
}

// MACRO: Long Wave gigante
for(let i = 0; i < groundVertices.length; i += 3) {
  const x = groundVertices[i];
  groundVertices[i+1] += Math.sin(x * 0.08) * 4;
}

// FLOW: Halfpipe e rampe
for(let i = 0; i < groundVertices.length; i += 3) {
  const x = groundVertices[i];
  const z = groundVertices[i+2];
  if(Math.abs(z) < 4) groundVertices[i+1] += Math.cos(x * 0.15) * 2;
  groundVertices[i+1] += Math.sin((x+z) * 0.2) * 1.5;
}

// MICRO: Rumore naturale
for(let i = 0; i < groundVertices.length; i += 3) {
  groundVertices[i+1] += (Math.random() - 0.5) * 0.15;
}

groundGeo.computeVertexNormals();
const groundMesh = new THREE.Mesh(groundGeo, materialGround);
groundMesh.receiveShadow = true;
scene.add(groundMesh);

const groundShape = new CANNON.Trimesh(
  Array.from(groundGeo.toNonIndexed().attributes.position.array),
  [...Array(groundGeo.attributes.position.count).keys()]
);
world.addBody(new CANNON.Body({ mass: 0, shape: groundShape, material: matGround }));

// --- ZONE SPECIALI ---
const matElastic = new CANNON.Material('elastic');
world.addContactMaterial(new CANNON.ContactMaterial(matElastic, matOrbo, {friction: 0.01, restitution: 0.9}));

const elasticMesh = new THREE.Mesh(new THREE.SphereGeometry(3, 24, 24), materialGround);
elasticMesh.position.set(15, 3, 0);
elasticMesh.castShadow = true;
scene.add(elasticMesh);
world.addBody(new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(3), material: matElastic, position: new CANNON.Vec3(15, 3, 0) }));

// --- NUVOLI MORBIDI ---
const cloudGroup = new THREE.Group();
for(let i = 0; i < 6; i++) {
  const cloud = new THREE.Mesh(
    new THREE.SphereGeometry(2 + Math.random(), 12, 12),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.8 })
  );
  cloud.position.set((Math.random()-0.5) * 50, 15 + Math.random() * 5, (Math.random()-0.5) * 50);
  cloudGroup.add(cloud);
}
scene.add(cloudGroup);

// --- ORBO: PERSONAGGIO VIVENTE ---
const orboMesh = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 32), materialOrbo);
orboMesh.castShadow = true;
scene.add(orboMesh);

const orboBody = new CANNON.Body({
  mass: 1,
  shape: new CANNON.Sphere(0.6),
  material: matOrbo,
  position: new CANNON.Vec3(0, 5, 0),
  linearDamping: 0.02,
  angularDamping: 0.02
});
world.addBody(orboBody);

// --- AI CURIOUSA: CERVELLO DI ORBO ---
class OrboAI {
  constructor(body) {
    this.body = body;
    this.curiosity = 0.8; // Quanto è curioso 0-1
    this.energy = 100;
    this.target = new THREE.Vector2(0, 0);
    this.nextDecision = 0;
    this.state = 'explore'; // explore, investigate, rest
  }

  think(t) {
    if(t < this.nextDecision) return;

    // Orbo è curioso: cerca posti nuovi
    const r = 10 + Math.random() * 15;
    const angle = Math.random() * Math.PI * 2;
    this.target.set(Math.cos(angle) * r, Math.sin(angle) * r);

    // Se vede una zona elastica, va a investigare
    if(Math.random() < this.curiosity) {
      this.target.set(15, 0); // Coordinate della bolla elastica
      this.state = 'investigate';
    } else {
      this.state = 'explore';
    }

    this.nextDecision = t + 3 + Math.random() * 2;
  }

  act() {
    const dx = this.target.x - this.body.position.x;
    const dz = this.target.y - this.body.position.z;
    const dist = Math.hypot(dx, dz);

    if(dist > 0.5 && this.energy > 20) {
      const speed = this.state === 'investigate'? 4.0 : 3.0;
      this.body.velocity.x = (dx/dist) * speed;
      this.body.velocity.z = (dz/dist) * speed;
      this.energy -= 0.1;
    } else {
      this.energy = Math.min(100, this.energy + 0.2); // Riposa
    }

    // Zona vento: spinta extra
    if(this.body.position.x > 10) {
      this.body.velocity.z += 0.3;
    }

    // Mai fermo: se la velocità scende troppo, spinta casuale
    if(this.body.velocity.length() < 0.3) {
      this.body.velocity.x += (Math.random()-0.5) * 2;
      this.body.velocity.z += (Math.random()-0.5) * 2;
    }

    // Rotolamento realistico
    this.body.angularVelocity.x = -this.body.velocity.z / 0.6;
    this.body.angularVelocity.z = this.body.velocity.x / 0.6;
  }

  update(t) {
    this.think(t);
    this.act();

    // Pulsazione: più veloce quando curioso
    const pulseSpeed = this.state === 'investigate'? 3 : 1.5;
    materialOrbo.emissiveIntensity = 0.1 + Math.sin(t * pulseSpeed) * 0.1;
  }
}

const orboAI = new OrboAI(orboBody);

// --- LOOP ---
let last = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  const t = now / 1000;

  orboAI.update(t);

  // Anima nuvole
  cloudGroup.children.forEach((cloud, i) => {
    cloud.position.x += Math.sin(t * 0.2 + i) * 0.02;
  });

  world.step(1/60, dt, 3);

  orboMesh.position.copy(orboBody.position);
  orboMesh.quaternion.copy(orboBody.quaternion);

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
