<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Orbo — Zoo Fisico</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#1a0a2e;font-family:sans-serif;touch-action:none}canvas{display:block}#actTitle{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;text-align:center;pointer-events:none;opacity:0;transition:opacity.5s}#actTitle.show{opacity:1}#actTitle h2{font-size:clamp(28px,8vw,64px);font-weight:900;color:#fff;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 40px #A855F7}#actTitle p{font-size:14px;color:#fff8;letter-spacing:4px;text-transform:uppercase}#topbar{position:fixed;top:0;left:0;right:0;padding:16px 20px;display:flex;justify-content:space-between;z-index:10;pointer-events:none}#logo{font-size:22px;font-weight:900;color:#fff}#logo em{color:#A855F7;font-style:normal}#actBadge{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff7;background:#fff1;padding:5px 14px;border-radius:100px}#progress{position:fixed;bottom:0;left:0;right:0;height:3px;background:#fff1}#progressFill{height:100%;width:0%;background:linear-gradient(90deg,#A855F7,#7DD3FC)}</style>
</head>
<body>
<div id="actTitle"><h2 id="actName">–</h2><p id="actSub">–</p></div>
<div id="topbar"><div id="logo">orb<em>o</em></div><div id="actBadge">Zoo Fisico</div></div>
<div id="progress"><div id="progressFill"></div></div>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
const isMobile=/Mobi|Android|iPhone/i.test(navigator.userAgent);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(isMobile?1:1.5);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();scene.background=new THREE.Color(0x0d0520);scene.fog=new THREE.FogExp2(0x0d0520,0.022);
const sky=new THREE.Mesh(new THREE.SphereGeometry(90,24,14),new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:{t:{value:new THREE.Color(0x0a0118)},b:{value:new THREE.Color(0x2d0a4e)}},vertexShader:`varying float y;void main(){y=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`uniform vec3 t,b;varying float y;void main(){gl_FragColor=vec4(mix(b,t,y*.5+.5),1.);}`}));sky.scale.set(-1,1,-1);scene.add(sky);
scene.add(new THREE.HemisphereLight(0x9b59ff,0x0a0118,.7));
const sun=new THREE.DirectionalLight(0xfff,1);sun.position.set(8,15,10);scene.add(sun);
const accent=new THREE.PointLight(0xA855F7,2,20);scene.add(accent);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);camera.position.set(0,10,16);

const world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});world.solver.iterations=isMobile?6:12;
const mat=new CANNON.Material();world.defaultContactMaterial=new CANNON.ContactMaterial(mat,mat,{friction:.4,restitution:.15});
const ground=new CANNON.Body({mass:0,shape:new CANNON.Plane(),material:mat});ground.quaternion.setFromEuler(-Math.PI/2,0,0);ground.position.y=-1.5;world.addBody(ground);

const blue=new THREE.MeshStandardMaterial({color:0x7DD3FC,roughness:.3});
const purp=new THREE.MeshStandardMaterial({color:0xA855F7,roughness:.3,emissive:0x6b21a8,emissiveIntensity:.4});
const glass=new THREE.MeshStandardMaterial({color:0xaaddff,transparent:true,opacity:.6,emissive:0x0ea5e9,emissiveIntensity:.2});
function addBody(m,s){scene.add(m);const b=new CANNON.Body({mass:0,material:mat});b.addShape(s);b.position.copy(m.position);b.quaternion.copy(m.quaternion);world.addBody(b);}

const hp=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,4,32,1,true,0,Math.PI).rotateX(Math.PI/2).rotateZ(Math.PI),blue);hp.position.set(0,.7,3);addBody(hp,new CANNON.Cylinder(2.2,2.2,.5,20));
const saddle=new THREE.Mesh(new THREE.PlaneGeometry(5.5,5.5,20,20),glass);saddle.position.set(0,4.5,0);saddle.rotation.x=-Math.PI/2;const sp=saddle.geometry.attributes.position;for(let i=0;i<sp.count;i++){const x=sp.getX(i),y=sp.getY(i);sp.setZ(i,.38*(x*x-y*y));}saddle.geometry.computeVertexNormals();addBody(saddle,new CANNON.Box(new CANNON.Vec3(2.7,.1,2.7)));
const funnel=new THREE.Mesh(new THREE.ConeGeometry(2.8,2.2,32,1,true).rotateX(Math.PI),purp);funnel.position.set(-3.5,7.5,0);funnel.material.side=2;addBody(funnel,new CANNON.Sphere(2.5));
const bPts=[];for(let i=0;i<=80;i++){const t=i/80*4.5;bPts.push(new THREE.Vector3(1.2*(t-Math.sin(t)),-1.2*(1-Math.cos(t)),0));}
const brach=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(bPts),80,.22,10,false).rotateY(Math.PI).rotateZ(-.12),purp);brach.position.set(3.5,11.2,-.5);addBody(brach,new CANNON.Box(new CANNON.Vec3(2,.3,1)));
const loop=new THREE.Mesh(new THREE.TorusGeometry(1.5,.18,10,40).rotateX(Math.PI/2),purp);loop.position.set(0,13,-1.5);addBody(loop,new CANNON.Box(new CANNON.Vec3(1.7,.4,1.7)));
const hPts=[];for(let i=0;i<=100;i++){const t=i/100,a=t*7*Math.PI;hPts.push(new THREE.Vector3(.9*Math.cos(a),1+t*12,.9*Math.sin(a)));}
const helix=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(hPts),80,.18,8,false),blue);helix.position.set(0,0,0);addBody(helix,new CANNON.Cylinder(1.2,1.2,12,12));

// GLOW FIXATI
const g1=new THREE.Mesh(new THREE.PlaneGeometry(4,4),new THREE.MeshBasicMaterial({color:0x7DD3FC,transparent:true,opacity:.05}));g1.rotation.x=-Math.PI/2;g1.position.set(0,.02,3);scene.add(g1);
const g2=new THREE.Mesh(new THREE.TorusGeometry(2.8,.08,12,60),new THREE.MeshBasicMaterial({color:0xA855F7}));g2.rotation.x=Math.PI/2;g2.position.set(-3.5,7.5,0);scene.add(g2);

const R=.32;const orbo=new THREE.Mesh(new THREE.SphereGeometry(R,32,32),new THREE.MeshStandardMaterial({color:0xA855F7,emissive:0xA855F7,emissiveIntensity:1,roughness:.2}));scene.add(orbo);
orbo.add(new THREE.Mesh(new THREE.SphereGeometry(R*2.2,16,16),new THREE.MeshBasicMaterial({color:0xA855F7,transparent:true,opacity:.08})));
orbo.add(new THREE.PointLight(0xA855F7,1.5,5));
const body=new CANNON.Body({mass:1,shape:new CANNON.Sphere(R),material:mat,linearDamping:.02});body.position.set(0,3,3);world.addBody(body);

const ACTS=[{n:"Half-Pipe",s:"dondola e salta",d:12,spawn:[0,2.8,5.5],cam:[0,5,10],look:[0,1,3],m:'hp'},{n:"Sella",s:"geometria impossibile",d:12,spawn:[0,6.5,0],cam:[5,7,5],look:[0,4.5,0],m:'sd'},{n:"Vortice",s:"spirale ipnotica",d:12,spawn:[-3.5,9.5,0],cam:[-6,10,4],look:[-3.5,7.5,0],m:'vx'},{n:"Brachistocrona",s:"la discesa più veloce",d:12,spawn:[3.5,11.6,-.5],cam:[7,12,3],look:[3.5,10,-.5],m:'bc'},{n:"Loop",s:"giro della morte",d:12,spawn:[0,14.5,-1.5],cam:[4,14,4],look:[0,13,-1.5],m:'lp'},{n:"Elica",s:"vite senza fine",d:14,spawn:[0,14,0],cam:[5,9,5],look:[0,7,0],m:'hx'}];
const TOT=ACTS.reduce((a,b)=>a+b.d,0);
const title=document.getElementById('actTitle'),tN=document.getElementById('actName'),tS=document.getElementById('actSub'),badge=document.getElementById('actBadge'),bar=document.getElementById('progressFill');
let show=-1,gt=0;
function now(){let t=gt%TOT;for(let i=0;i<ACTS.length;i++){if(t<ACTS[i].d)return{...ACTS[i],i,t};t-=ACTS[i].d;}return{...ACTS[0],i:0,t:0}}

function ai(dt,a){const p=body.position;if(p.y<-5||Math.abs(p.x)>25||Math.abs(p.z)>25){body.position.set(...a.spawn);body.velocity.set(0,0,0);return;}
 if(a.m==='hp'){body.applyForce(new CANNON.Vec3(Math.sin(a.t*2)*4,0,0),p);if(a.t>6&&a.t<6.2)body.velocity.y=5;}
 if(a.m==='sd'){body.applyForce(new CANNON.Vec3((Math.sin(a.t)-p.x)*2,0,(Math.cos(a.t)-p.z)*2),p);}
 if(a.m==='vx'){const dx=p.x+3.5,dz=p.z;body.applyForce(new CANNON.Vec3(-dz*3,-1,dx*3),p);}
 if(a.m==='bc'){if(a.t<1)body.applyForce(new CANNON.Vec3(-3,0,0),p);}
 if(a.m==='lp'){body.applyForce(new CANNON.Vec3(Math.sin(a.t*3)*5,0,0),p);if(a.t>4&&a.t<4.15)body.velocity.y=6;}
 if(a.m==='hx'){const ang=a.t*2;body.applyForce(new CANNON.Vec3(Math.cos(ang)-p.x,-1,Math.sin(ang)-p.z),p);}
}
const clock=new THREE.Clock();
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.033);gt+=dt;world.step(1/60,dt,3);const a=now();if(a.i!==show){show=a.i;tN.textContent=a.n;tS.textContent=a.s;badge.textContent=`${a.i+1}/${ACTS.length}`;title.classList.add('show');setTimeout(()=>title.classList.remove('show'),1800);body.position.set(...a.spawn);body.velocity.set(0,0,0);}ai(dt,a);orbo.position.copy(body.position);orbo.rotation.x+=body.velocity.length()*dt*2;accent.position.lerp(orbo.position,.1);camera.position.lerp(new THREE.Vector3(...a.cam),dt*1.2);camera.lookAt(...a.look);bar.style.width=`${gt%TOT/TOT*100}%`;renderer.render(scene,camera);}tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
