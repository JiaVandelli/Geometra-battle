<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Kubo — Physics Lab</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","cannon-es":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0A0F1C;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:none}
canvas{display:block}
#ui{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
#title{color:#00FFD1;font-weight:900;font-size:22px;text-shadow:0 0 15px #00FFD1}
#title span{color:#A855F7}
#info{color:#fff;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:16px;font-size:12px;border:1px solid #00FFD1;max-width:140px;text-align:right}
#hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#00FFD1;background:rgba(0,0,0,.7);padding:8px 14px;border-radius:20px;font-size:13px;pointer-events:none;opacity:1;transition:opacity.8s;border:1px solid #00FFD1}
</style>
</head>
<body>
<div id="ui"><div id="title">kub<span>o</span> lab</div><div id="info">5 forme ideali</div></div>
<div id="hint">Laboratorio di fisica</div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x0A0F1C);scene.fog=new THREE.Fog(0x0A0F1C,30,60);
const isMobile=/Android|iPhone|iPad/i.test(navigator.userAgent);
const camera=new THREE.PerspectiveCamera(isMobile?75:65,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:!isMobile,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x1A2A3A,0x0A0F1C,.6));
const dl=new THREE.DirectionalLight(0x00FFD1,1);dl.position.set(10,20,10);scene.add(dl);

const ciano=new THREE.MeshStandardMaterial({color:0x00FFD1,emissive:0x00FFD1,emissiveIntensity:.7,roughness:.4});
const viola=new THREE.MeshStandardMaterial({color:0xA855F7,emissive:0xA855F7,emissiveIntensity:.85,roughness:.3});
const arancio=new THREE.MeshStandardMaterial({color:0xFF6B35,emissive:0xFF6B35,emissiveIntensity:.6,roughness:.5});

const world=new CANNON.World({gravity:new CANNON.Vec3(0,-13,0)});
world.allowSleep=false;
const mat=new CANNON.Material();
world.defaultContactMaterial=new CANNON.ContactMaterial(mat,mat,{friction:0.7,restitution:0.18});

function addStatic(mesh){
  scene.add(mesh);
  const g=mesh.geometry.clone();g.applyMatrix4(mesh.matrixWorld);
  if(!g.index)g.setIndex([...Array(g.attributes.position.count).keys()]);
  const shape=new CANNON.Trimesh(Array.from(g.attributes.position.array),Array.from(g.index.array));
  const b=new CANNON.Body({mass:0,material:mat});b.addShape(shape);world.addBody(b);
}

// 1. CATENARIE
const catGroup=new THREE.Group();
for(let i=0;i<5;i++){const pts=[];for(let j=0;j<=20;j++){const t=j/20;pts.push(new THREE.Vector3(-3+i*1.5,Math.cosh((t-.5)*2.5)*0.7,0))}const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),16,.08,6,false),ciano);m.position.set(0,0.5,-4);catGroup.add(m)}
catGroup.children.forEach(m=>{m.updateMatrixWorld();addStatic(m)});

// 2. BRACHISTOCRONA
const r=1.1,ptsB=[];for(let i=0;i<=40;i++){const t=i/40*Math.PI*1.3;ptsB.push(new THREE.Vector3(r*(t-Math.sin(t))-2,-r*(1-Math.cos(t))+5,3))}addStatic(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ptsB),40,.1,8,false),arancio));

// 3. ELICA
const ptsH=[];for(let i=0;i<=80;i++){const t=i/80,a=t*Math.PI*6;ptsH.push(new THREE.Vector3(Math.cos(a)*0.8,2+t*6,Math.sin(a)*0.8+2))}addStatic(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ptsH),80,.09,6,false),viola));

// 4. DENTE DI SEGA
const saw=new THREE.Group();for(let i=0;i<12;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.15,0.8),ciano);s.position.set(3.5+i*0.35,0.3+i*0.22,-2);s.rotation.z=-0.15;saw.add(s)}saw.children.forEach(m=>{m.updateMatrixWorld();addStatic(m)});

// 5. SELLA - ABBASSATA a 2.8 per non piantarsi
const saddleGeo=new THREE.PlaneGeometry(3,3,20,20);const pos=saddleGeo.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i);pos.setZ(i,0.25*(x*x-y*y))}saddleGeo.computeVertexNormals();saddleGeo.rotateX(-Math.PI/2);const saddle=new THREE.Mesh(saddleGeo,ciano);saddle.position.set(-3,2.8,2.5);addStatic(saddle);

// 6. LOOP
const loop=new THREE.Mesh(new THREE.TorusGeometry(1.1,.12,10,60).rotateX(Math.PI/2),viola);loop.position.set(0,9,0);addStatic(loop);

// TERRA
const ground=new CANNON.Body({mass:0,material:mat,shape:new CANNON.Plane()});ground.quaternion.setFromEuler(-Math.PI/2,0,0);ground.position.y=-0.5;world.addBody(ground);

// KUBO - FIX: BoxGeometry corretta
const s=0.26;
const kuboMesh=new THREE.Mesh(new THREE.BoxGeometry(s,s,s,2,2,2),viola); // era s,s,2
scene.add(kuboMesh);
const kubo=new CANNON.Body({mass:2.2,shape:new CANNON.Box(new CANNON.Vec3(s/2,s/2,s/2)),material:mat,linearDamping:.015,angularDamping:.12});
kubo.position.set(-2,6,3);world.addBody(kubo);

const stations=[{pos:new THREE.Vector3(-2,5,3),name:"Brachistocrona"},{pos:new THREE.Vector3(0,0.8,-4),name:"Catenarie"},{pos:new THREE.Vector3(0,9,0),name:"Loop"},{pos:new THREE.Vector3(0,5,2),name:"Elica"},{pos:new THREE.Vector3(3.5,1,-2),name:"Dente di sega"},{pos:new THREE.Vector3(-3,3.1,2.5),name:"Sella"}];
let idx=0,timer=0,stuckTime=0;

function nextStation(){idx=(idx+1)%stations.length;document.getElementById('info').textContent=stations[idx].name;timer=4+Math.random()*2}

function ai(dt){
  timer-=dt;const p=kubo.position,to=stations[idx].pos;const dir=new CANNON.Vec3(to.x-p.x,to.y-p.y,to.z-p.z);
  if(dir.length()>1){dir.normalize();kubo.applyForce(new CANNON.Vec3(dir.x*5,dir.y*3.5,dir.z*5));kubo.applyTorque(new CANNON.Vec3(dir.z*0.6,0,-dir.x*0.6))}

  // FIX: anti-stuck con timer, non istantaneo
  if(kubo.velocity.length()<0.4){stuckTime+=dt;if(stuckTime>1.2){kubo.applyImpulse(new CANNON.Vec3((Math.random()-.5)*1.2,0.6,(Math.random()-.5)*1.2));stuckTime=0}}else{stuckTime=0}

  if(timer<=0)nextStation();
  if(p.y<-1){kubo.position.set(-2,6,3);kubo.velocity.set(0,0,0);kubo.angularVelocity.set(0,0,0)}
}

const center=new THREE.Vector3(0,4,0);
function updateCam(){const t=performance.now()*0.00004;const r=isMobile?14:18;camera.position.set(Math.cos(t)*r,10+Math.sin(t*0.5)*2,Math.sin(t)*r);camera.lookAt(center)}

setTimeout(()=>{document.getElementById('hint').style.opacity='0';nextStation();kubo.applyImpulse(new CANNON.Vec3(2,0,1))},2000);

const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);world.step(1/60,dt,3);ai(dt);
  kuboMesh.position.copy(kubo.position);kuboMesh.quaternion.copy(kubo.quaternion);
  kuboMesh.material.emissiveIntensity=0.8+Math.sin(performance.now()*0.005)*0.3;
  updateCam();renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
