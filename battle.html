<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>BLACKHOLE ARENA</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Rajdhani',sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}

#topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 24px;z-index:20;pointer-events:none}
.player-hud{display:flex;flex-direction:column;gap:5px;min-width:200px}
.player-hud.right{align-items:flex-end}
.ph-name{font-family:'Black Han Sans',sans-serif;font-size:20px;letter-spacing:3px;text-shadow:0 0 15px currentColor}
.ph-tag{font-size:10px;letter-spacing:4px;opacity:.55;font-family:'Rajdhani',sans-serif}
.ph-bar-wrap{width:180px;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.ph-bar{height:100%;border-radius:3px;background:currentColor;box-shadow:0 0 8px currentColor;transition:width .3s}
.ph-kills{font-family:'Black Han Sans',sans-serif;font-size:34px;line-height:1;text-shadow:0 0 20px currentColor}
.player-hud.right .ph-kills{text-align:right}
.player-hud.right .ph-bar-wrap{align-self:flex-end}

#center-hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);text-align:center;z-index:20;pointer-events:none}
#round-label{font-family:'Rajdhani',sans-serif;font-size:11px;letter-spacing:6px;color:#fff;opacity:.35}
#round-num{font-family:'Black Han Sans',sans-serif;font-size:26px;color:#fff;letter-spacing:2px;text-shadow:0 0 20px rgba(255,255,255,.3)}

#banner{position:fixed;top:48%;left:50%;transform:translate(-50%,-50%);z-index:30;text-align:center;pointer-events:none;opacity:0;transition:opacity .07s}
#banner-text{font-family:'Black Han Sans',sans-serif;font-size:clamp(32px,7vw,72px);letter-spacing:5px;color:#fff;text-shadow:0 0 30px currentColor,0 0 80px currentColor;white-space:nowrap}

#winner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:35;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#winner-label{font-size:11px;letter-spacing:10px;color:rgba(255,255,255,.4);font-family:'Rajdhani',sans-serif;margin-bottom:6px}
#winner-name{font-family:'Black Han Sans',sans-serif;font-size:clamp(44px,9vw,88px);letter-spacing:7px;text-shadow:0 0 40px currentColor,0 0 120px currentColor}
#winner-next{font-size:10px;letter-spacing:5px;color:rgba(255,255,255,.25);margin-top:12px;animation:blink 1s infinite}

#killfeed{position:fixed;bottom:55px;right:18px;z-index:20;display:flex;flex-direction:column;gap:5px;align-items:flex-end;pointer-events:none}
.kf-row{font-size:12px;font-weight:700;letter-spacing:2px;padding:4px 11px;background:rgba(0,0,0,.75);border-radius:4px;animation:kfIn .15s ease;transition:opacity .8s}
@keyframes kfIn{from{transform:translateX(16px);opacity:0}}

#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;transition:opacity 1.2s}
#intro-title{font-family:'Black Han Sans',sans-serif;font-size:clamp(44px,10vw,100px);letter-spacing:10px;color:#fff;text-shadow:0 0 30px rgba(255,100,0,.9),0 0 80px rgba(255,40,0,.4)}
#intro-vs{font-size:12px;letter-spacing:8px;color:rgba(255,255,255,.25);margin:18px 0;font-family:'Rajdhani',sans-serif}
#intro-players{display:flex;gap:70px;align-items:center}
.ip{text-align:center}
.ip-orb{width:56px;height:56px;border-radius:50%;margin:0 auto 10px;box-shadow:0 0 18px currentColor,0 0 48px currentColor}
.ip-name{font-family:'Black Han Sans',sans-serif;font-size:16px;letter-spacing:3px}
.ip-style{font-size:10px;letter-spacing:4px;opacity:.45;margin-top:3px}
#intro-press{margin-top:44px;font-size:10px;letter-spacing:6px;color:rgba(255,255,255,.2);animation:blink 1.1s infinite}

#bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:44px;padding:9px;font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.22);pointer-events:none}
.bs span{color:rgba(255,255,255,.55)}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="intro">
  <div id="intro-title">BLACKHOLE ARENA</div>
  <div id="intro-vs">— VS —</div>
  <div id="intro-players"></div>
  <div id="intro-press">⬛ STARTING IN 3s ⬛</div>
</div>

<div id="topbar">
  <div class="player-hud left" id="hud0"></div>
  <div id="center-hud">
    <div id="round-label">ROUND</div>
    <div id="round-num">1</div>
  </div>
  <div class="player-hud right" id="hud1"></div>
</div>

<div id="banner"><div id="banner-text"></div></div>
<div id="winner">
  <div id="winner-label">WINNER</div>
  <div id="winner-name"></div>
  <div id="winner-next">NEXT ROUND IN 4s</div>
</div>
<div id="killfeed"></div>
<div id="bottom">
  <div class="bs">ALIVE <span id="aliveEl">2</span></div>
  <div class="bs">ROUND <span id="roundEl">1</span></div>
  <div class="bs">KILLS <span id="killsEl">0</span></div>
</div>

<script>
/* ══════════════════════════════════════════
   BLACKHOLE ARENA — Anime Edition
   No Cannon. Custom smooth physics.
   Two unique AI personalities.
══════════════════════════════════════════ */

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, CX, CY, AR; // AR = arena radius

function resize(){
  W  = canvas.width  = innerWidth;
  H  = canvas.height = innerHeight;
  CX = W / 2;
  CY = H / 2;
  AR = Math.min(W, H) * 0.37;
}
resize();
window.addEventListener('resize', resize);

/* ─── PLAYERS ─── */
const PLAYERS = [
  { name:'RYUU',  sub:'BERSERKER',     color:'#ff4422', style:'berserker', cd:3.8, power:'DRAGON STRIKE' },
  { name:'KAIRO', sub:'TRICKSTER',     color:'#00ccff', style:'trickster', cd:4.4, power:'VOID PULSE'    },
];
const killsTotal = [0, 0];
let grandTotal   = 0;

/* ─── STARS (pre-generate once) ─── */
const STARS = [];
for(let i=0;i<280;i++) STARS.push({
  x: Math.random(), y: Math.random(),
  s: .4+Math.random()*1.3,
  a: .15+Math.random()*.55,
  tw: Math.random()*Math.PI*2,
  ts: .5+Math.random()*.8,
});

/* ══════════════════════════════════════════
   EFFECTS POOLS
══════════════════════════════════════════ */
const particles  = [];
const klines     = [];
const shockwaves = [];

function spawnParticles(x,y,color,count=30,force=200,type='dot'){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2;
    const s = force*(.4+Math.random()*.9);
    particles.push({
      x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - force*.1,
      life:1, maxLife:.55+Math.random()*.55,
      size: type==='line' ? 2+Math.random()*2 : 2+Math.random()*4,
      color, type,
      rot: Math.random()*Math.PI*2,
    });
  }
}

function spawnKLines(x,y,color,count=16,len=100){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2;
    klines.push({ x,y, a, len:len*(.4+Math.random()*.9), color,
      life:.22, maxLife:.22, w:1+Math.random()*2.5 });
  }
}

function spawnShockwave(x,y,color,maxR=100){
  shockwaves.push({ x,y, r:6, maxR, color, life:1 });
}

/* ─── FLASH ─── */
let flashA=0, flashCol='#fff';
function doFlash(c,a=.55){ flashA=Math.max(flashA,a); flashCol=c; }

/* ─── FREEZE ─── */
let freezeT=0;
function doFreeze(d=.1){ freezeT=Math.max(freezeT,d); }

/* ─── BANNER ─── */
const bannerEl     = document.getElementById('banner');
const bannerTextEl = document.getElementById('banner-text');
let bannerT=0;
function showBanner(txt,color,dur=1.0){
  bannerTextEl.textContent = txt;
  bannerTextEl.style.color = color;
  bannerTextEl.style.textShadow = `0 0 28px ${color}, 0 0 70px ${color}`;
  bannerEl.style.opacity  = '1';
  bannerT = dur;
}

/* ─── KILLFEED ─── */
const kfEl = document.getElementById('killfeed');
function addKF(killer,victim){
  const d   = document.createElement('div');
  d.className = 'kf-row';
  d.innerHTML = `<span style="color:${PLAYERS[killer].color}">${PLAYERS[killer].name}</span>`
              + ` <span style="opacity:.35">⊗</span> `
              + `<span style="color:${PLAYERS[victim].color}">${PLAYERS[victim].name}</span>`;
  kfEl.appendChild(d);
  grandTotal++;
  document.getElementById('killsEl').textContent = grandTotal;
  setTimeout(()=>{ d.style.opacity='0'; setTimeout(()=>d.remove(),900); }, 3000);
  while(kfEl.children.length>4) kfEl.removeChild(kfEl.firstChild);
}

/* ══════════════════════════════════════════
   TRAIL
══════════════════════════════════════════ */
function makeTrail(n=50){ return { pts:[], n }; }
function trailPush(tr,x,y){
  tr.pts.push({x,y});
  if(tr.pts.length>tr.n) tr.pts.shift();
}
function drawTrail(tr, color, baseW){
  const n = tr.pts.length;
  if(n<2) return;
  ctx.save();
  for(let i=1;i<n;i++){
    const t  = i/n;
    const p0 = tr.pts[i-1], p1 = tr.pts[i];
    ctx.beginPath();
    ctx.moveTo(p0.x,p0.y);
    ctx.lineTo(p1.x,p1.y);
    ctx.strokeStyle = color;
    ctx.lineWidth   = baseW * t;
    ctx.globalAlpha = t * .5;
    ctx.shadowBlur  = 12;
    ctx.shadowColor = color;
    ctx.stroke();
  }
  ctx.restore();
}

/* ══════════════════════════════════════════
   ORB CLASS
══════════════════════════════════════════ */
class Orb {
  constructor(id, x, y){
    this.id    = id;
    this.x     = x;
    this.y     = y;
    this.vx    = 0;
    this.vy    = 0;
    this.alive = true;
    this.kills = 0;

    const p      = PLAYERS[id];
    this.color   = p.color;
    this.style   = p.style;
    this.cd      = p.cd * (.25 + Math.random()*.5);
    this.maxCd   = p.cd;

    this.trail   = makeTrail(48);
    this.pulseT  = Math.random()*Math.PI*2;
    this.squishX = 1;
    this.squishY = 1;
    this.hitFlash= 0;

    /* AI state machine */
    this.state   = 'idle';
    this.stateT  = 0;
    this.anger   = 0;   // berserker only
    this.fear    = 0;   // trickster only
    this.patience= 0;   // trickster only
    this.feintDir= 1;
    this.feintAmt= 0;
    this.chargeX = CX;
    this.chargeY = CY;
  }

  get r(){  return AR * 0.075; }
  get baseSpeed(){ return AR * 1.85; }

  get speed(){
    const bs = this.baseSpeed;
    if(this.style==='berserker'){
      if(this.state==='charge') return bs * (2.6 + this.anger*.6);
      return bs * (1.05 + this.anger*.25);
    }
    if(this.state==='charge') return bs * 2.5;
    if(this.state==='idle')   return bs * .65;
    return bs * .92;
  }

  setState(s, dur){ this.state=s; this.stateT=dur; }

  /* ── BERSERKER AI ──
     Sempre avanti. Rabbia = velocità. Tre modalità: chase / charge / scarto */
  aiBerserker(dt, ex, ey){
    this.stateT -= dt;
    const dx   = ex - this.x, dy = ey - this.y;
    const dist = Math.hypot(dx,dy)||1;
    const dn   = dist / AR;
    const myR  = Math.hypot(this.x-CX, this.y-CY);

    this.anger = Math.min(1, killsTotal[this.id]*.2 + .08);

    if(this.stateT<=0){
      if(dn<.28 && Math.random()<.65)         this.setState('charge',.16);
      else if(dn<.22 && Math.random()<.35)    this.setState('evade', .18);
      else                                     this.setState('chase', .22+Math.random()*.18);
    }

    let fx=0, fy=0;
    if(this.state==='chase' || this.state==='idle'){
      fx = (dx/dist)*this.speed;
      fy = (dy/dist)*this.speed;
    } else if(this.state==='charge'){
      fx = (dx/dist)*this.speed;
      fy = (dy/dist)*this.speed;
    } else if(this.state==='evade'){
      fx = -(dy/dist)*this.speed*.85;
      fy =  (dx/dist)*this.speed*.85;
    }

    /* bordo: lieve spinta verso centro */
    const edgeT = Math.max(0,(myR - AR*.78)/(AR*.22));
    if(edgeT>0){
      const tc = Math.hypot(CX-this.x,CY-this.y)||1;
      fx += ((CX-this.x)/tc)*this.speed*edgeT*2.2;
      fy += ((CY-this.y)/tc)*this.speed*edgeT*2.2;
    }

    const acc = this.state==='charge' ? 22 : 10;
    this.vx += (fx - this.vx)*Math.min(1, acc*dt);
    this.vy += (fy - this.vy)*Math.min(1, acc*dt);

    const s = Math.hypot(this.vx,this.vy);
    const t = Math.min(1, s/(this.speed*1.3));
    this.squishX = 1 - t*.16;
    this.squishY = 1 + t*.16;
  }

  /* ── TRICKSTER AI ──
     Orbita. Osserva. Quando il nemico è vicino al bordo: COLPISCE. */
  aiTrickster(dt, ex, ey){
    this.stateT -= dt;
    const dx   = ex - this.x, dy = ey - this.y;
    const dist = Math.hypot(dx,dy)||1;
    const dn   = dist / AR;
    const myR  = Math.hypot(this.x-CX, this.y-CY);
    const enR  = Math.hypot(ex-CX, ey-CY);

    this.fear     = Math.max(0,(myR - AR*.68)/(AR*.32));
    this.patience = Math.max(0,(enR - AR*.58)/(AR*.42));

    if(this.stateT<=0){
      if(this.fear>.5){
        this.setState('evade',.28);
      } else if(this.patience>.6 && dn<.6){
        /* nemico esposto: charge! */
        this.chargeX = ex; this.chargeY = ey;
        this.setState('charge',.2);
      } else if(dn<.32 && Math.random()<.4){
        this.setState('feint',.32);
        this.feintDir = Math.random()<.5?1:-1;
        this.feintAmt = .55+Math.random()*.5;
      } else if(dn<.55){
        this.setState('approach',.2+Math.random()*.15);
      } else {
        this.setState('idle',.18);
      }
    }

    let fx=0, fy=0;
    if(this.state==='idle'){
      /* orbita lentamente */
      const ang    = Math.atan2(this.y-CY, this.x-CX);
      const orbitR = AR*.42;
      const tx     = CX + Math.cos(ang+.022)*orbitR;
      const ty     = CY + Math.sin(ang+.022)*orbitR;
      const od     = Math.hypot(tx-this.x,ty-this.y)||1;
      fx = ((tx-this.x)/od)*this.speed*.7;
      fy = ((ty-this.y)/od)*this.speed*.7;
    } else if(this.state==='approach'){
      fx = (dx/dist)*this.speed*.7;
      fy = (dy/dist)*this.speed*.7;
    } else if(this.state==='feint'){
      const phase = this.stateT/.32;
      if(phase>.5){ fx=(dx/dist)*this.speed*.85; fy=(dy/dist)*this.speed*.85; }
      else { fx=(-dy/dist)*this.feintDir*this.speed*this.feintAmt; fy=(dx/dist)*this.feintDir*this.speed*this.feintAmt; }
    } else if(this.state==='charge'){
      const cdx=this.chargeX-this.x, cdy=this.chargeY-this.y;
      const cd=Math.hypot(cdx,cdy)||1;
      fx=(cdx/cd)*this.speed; fy=(cdy/cd)*this.speed;
    } else if(this.state==='evade'){
      const tc=Math.hypot(CX-this.x,CY-this.y)||1;
      fx=((CX-this.x)/tc)*this.speed*1.2;
      fy=((CY-this.y)/tc)*this.speed*1.2;
    }

    /* repulsione bordo più decisa */
    const edgeT=Math.max(0,(myR-AR*.7)/(AR*.3));
    if(edgeT>0){
      const tc=Math.hypot(CX-this.x,CY-this.y)||1;
      fx+=((CX-this.x)/tc)*this.speed*edgeT*3.2;
      fy+=((CY-this.y)/tc)*this.speed*edgeT*3.2;
    }

    const acc=this.state==='charge'?22:(this.state==='feint'?14:8);
    this.vx+=(fx-this.vx)*Math.min(1,acc*dt);
    this.vy+=(fy-this.vy)*Math.min(1,acc*dt);

    const s=Math.hypot(this.vx,this.vy);
    const t=Math.min(1,s/(this.speed*1.2));
    this.squishX=1-t*.12;
    this.squishY=1+t*.12;
  }

  /* ── POWER ── */
  firePower(enemy){
    const p = PLAYERS[this.id];
    if(this.style==='berserker'){
      /* Dragon Strike — onda d'urto */
      spawnShockwave(this.x,this.y,this.color,this.r*3.8);
      spawnKLines(this.x,this.y,this.color,22,AR*.32);
      doFlash(this.color,.32);
      const dx=enemy.x-this.x, dy=enemy.y-this.y;
      const d=Math.hypot(dx,dy)||1;
      if(d<this.r*6){
        enemy.vx+=(dx/d)*AR*1.15; enemy.vy+=(dy/d)*AR*1.15;
        enemy.hitFlash=1;
        doFreeze(.1);
        showBanner('DRAGON STRIKE!', this.color, .85);
      }
    } else {
      /* Void Pulse — attrazione */
      spawnShockwave(this.x,this.y,this.color,this.r*5.5);
      spawnParticles(this.x,this.y,this.color,28,180,'dot');
      doFlash(this.color,.28);
      const dx=this.x-enemy.x, dy=this.y-enemy.y;
      const d=Math.hypot(dx,dy)||1;
      if(d<this.r*8){
        enemy.vx+=(dx/d)*AR*.95; enemy.vy+=(dy/d)*AR*.95;
        enemy.hitFlash=.85;
        doFreeze(.08);
        showBanner('VOID PULSE', this.color, .85);
      }
    }
  }

  step(dt, enemy){
    if(!this.alive) return;
    this.pulseT  += dt*2.8;
    this.hitFlash = Math.max(0, this.hitFlash - dt*3.5);
    this.cd       = Math.max(0, this.cd-dt);
    if(this.cd<=0){ this.firePower(enemy); this.cd=this.maxCd; }

    if(this.style==='berserker') this.aiBerserker(dt, enemy.x, enemy.y);
    else                          this.aiTrickster(dt, enemy.x, enemy.y);

    /* clamp speed */
    const spd    = Math.hypot(this.vx,this.vy);
    const maxSpd = this.speed * (this.state==='charge'?2.8:1.6);
    if(spd>maxSpd){ this.vx=this.vx/spd*maxSpd; this.vy=this.vy/spd*maxSpd; }

    this.x += this.vx*dt;
    this.y += this.vy*dt;
    trailPush(this.trail, this.x, this.y);

    /* out of arena */
    if(Math.hypot(this.x-CX, this.y-CY) > AR + this.r*.5) this.alive=false;
  }

  draw(){
    if(!this.alive) return;
    const r     = this.r * (1 + Math.sin(this.pulseT)*.035);
    const ang   = Math.atan2(this.vy,this.vx);
    const speed = Math.hypot(this.vx,this.vy);

    drawTrail(this.trail, this.color, r*.32);

    ctx.save();
    ctx.translate(this.x, this.y);

    /* charge aura */
    if(this.state==='charge'){
      ctx.save();
      const ar=r*2.4, ang2=Math.atan2(this.vy,this.vx);
      const grd=ctx.createRadialGradient(0,0,r*.5,0,0,ar);
      grd.addColorStop(0,this.color+'aa');
      grd.addColorStop(1,'transparent');
      ctx.globalAlpha=.4;
      ctx.fillStyle=grd;
      ctx.beginPath(); ctx.arc(0,0,ar,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    /* squish */
    ctx.rotate(ang);
    ctx.scale(this.squishX, this.squishY);
    ctx.rotate(-ang);

    /* hit white flash */
    if(this.hitFlash>0){
      ctx.save();
      ctx.globalAlpha=this.hitFlash*.65;
      ctx.fillStyle='#fff';
      ctx.shadowBlur=28; ctx.shadowColor='#fff';
      ctx.beginPath(); ctx.arc(0,0,r*1.35,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    /* body gradient */
    const grd=ctx.createRadialGradient(-r*.28,-r*.28,r*.04,0,0,r);
    grd.addColorStop(0,'#ffffff');
    grd.addColorStop(.18,this.color);
    grd.addColorStop(1,'rgba(0,0,0,.75)');
    ctx.shadowBlur=28; ctx.shadowColor=this.color;
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

    /* specular highlight */
    ctx.save();
    ctx.globalAlpha=.55;
    ctx.strokeStyle='rgba(255,255,255,.7)';
    ctx.lineWidth=1.5;
    ctx.shadowBlur=0;
    ctx.beginPath();
    ctx.arc(-r*.18,-r*.22, r*.52, Math.PI*1.1, Math.PI*1.82);
    ctx.stroke();
    ctx.restore();

    ctx.restore();

    /* name above orb */
    const p = PLAYERS[this.id];
    ctx.save();
    ctx.font=`bold ${Math.round(r*.68)}px 'Black Han Sans',sans-serif`;
    ctx.fillStyle='rgba(255,255,255,.88)';
    ctx.textAlign='center';
    ctx.shadowBlur=10; ctx.shadowColor=this.color;
    ctx.fillText(p.name, this.x, this.y - r*1.62);
    ctx.restore();
  }
}

/* ══════════════════════════════════════════
   ARENA DRAW
══════════════════════════════════════════ */
let arenaRot=0;
function drawArena(t){
  arenaRot += .003;

  /* bg */
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);

  /* deep purple radial bg */
  const bgG=ctx.createRadialGradient(CX,CY,0,CX,CY,AR*1.9);
  bgG.addColorStop(0,'#0c0016');
  bgG.addColorStop(.55,'#04000c');
  bgG.addColorStop(1,'#000');
  ctx.fillStyle=bgG;
  ctx.fillRect(0,0,W,H);

  /* stars */
  ctx.save();
  STARS.forEach(s=>{
    const twinkle=.7+.3*Math.sin(t*s.ts+s.tw);
    ctx.globalAlpha=s.a*twinkle;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.s, 0, Math.PI*2); ctx.fill();
  });
  ctx.restore();

  /* arena floor glow */
  const fg=ctx.createRadialGradient(CX,CY,0,CX,CY,AR);
  fg.addColorStop(0,'rgba(60,0,120,.16)');
  fg.addColorStop(.65,'rgba(30,0,70,.06)');
  fg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=fg;
  ctx.beginPath(); ctx.arc(CX,CY,AR,0,Math.PI*2); ctx.fill();

  /* concentric rings */
  ctx.save();
  [.33,.6,.82].forEach(f=>{
    ctx.strokeStyle='#6600bb';
    ctx.lineWidth=1;
    ctx.globalAlpha=.1;
    ctx.beginPath(); ctx.arc(CX,CY,AR*f,0,Math.PI*2); ctx.stroke();
  });
  ctx.restore();

  /* rotating spokes */
  ctx.save();
  ctx.translate(CX,CY); ctx.rotate(arenaRot);
  ctx.strokeStyle='#8833cc'; ctx.lineWidth=.8; ctx.globalAlpha=.06;
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a)*AR, Math.sin(a)*AR); ctx.stroke();
  }
  ctx.restore();

  /* main rim */
  ctx.save();
  ctx.strokeStyle='#cc00ff'; ctx.lineWidth=2.5; ctx.globalAlpha=.65;
  ctx.shadowBlur=18; ctx.shadowColor='#cc00ff';
  ctx.beginPath(); ctx.arc(CX,CY,AR,0,Math.PI*2); ctx.stroke();
  ctx.restore();

  /* danger glow on rim */
  const dg=ctx.createRadialGradient(CX,CY,AR*.84,CX,CY,AR*1.06);
  dg.addColorStop(0,'rgba(255,0,60,0)');
  dg.addColorStop(.7,'rgba(255,0,60,.1)');
  dg.addColorStop(1,'rgba(255,0,60,0)');
  ctx.fillStyle=dg;
  ctx.beginPath(); ctx.arc(CX,CY,AR*1.06,0,Math.PI*2); ctx.fill();

  /* vortex center */
  ctx.save();
  ctx.translate(CX,CY); ctx.rotate(-arenaRot*2.5);
  const vc=ctx.createRadialGradient(0,0,0,0,0,AR*.1);
  vc.addColorStop(0,'rgba(200,0,255,.75)');
  vc.addColorStop(.5,'rgba(100,0,180,.3)');
  vc.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=vc;
  ctx.beginPath(); ctx.arc(0,0,AR*.1,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ══════════════════════════════════════════
   EFFECTS TICK & DRAW
══════════════════════════════════════════ */
function tickEffects(dt){
  /* particles */
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt/p.maxLife;
    if(p.life<=0){particles.splice(i,1);continue;}
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vy+=240*dt;
    p.vx*=Math.pow(.90,dt*60);
    p.rot+=.12;
  }
  /* klines */
  for(let i=klines.length-1;i>=0;i--){
    klines[i].life-=dt;
    if(klines[i].life<=0) klines.splice(i,1);
  }
  /* shockwaves */
  for(let i=shockwaves.length-1;i>=0;i--){
    const s=shockwaves[i]; s.life-=dt*2.4; s.r+=s.maxR*dt*2.4;
    if(s.life<=0) shockwaves.splice(i,1);
  }
}

function drawEffects(){
  /* shockwaves */
  shockwaves.forEach(s=>{
    ctx.save();
    ctx.globalAlpha=s.life*.55;
    ctx.strokeStyle=s.color;
    ctx.lineWidth=3*s.life;
    ctx.shadowBlur=18; ctx.shadowColor=s.color;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  });
  /* klines */
  klines.forEach(k=>{
    const a=k.life/k.maxLife;
    ctx.save();
    ctx.globalAlpha=a*.75;
    ctx.strokeStyle=k.color;
    ctx.lineWidth=k.w;
    ctx.shadowBlur=8; ctx.shadowColor=k.color;
    ctx.beginPath();
    const ex=k.x+Math.cos(k.a)*(8+k.len*a);
    const ey=k.y+Math.sin(k.a)*(8+k.len*a);
    ctx.moveTo(k.x+Math.cos(k.a)*6, k.y+Math.sin(k.a)*6);
    ctx.lineTo(ex,ey); ctx.stroke();
    ctx.restore();
  });
  /* particles */
  particles.forEach(p=>{
    const a=p.life;
    ctx.save(); ctx.globalAlpha=a;
    ctx.translate(p.x,p.y);
    if(p.type==='line'){
      ctx.rotate(p.rot);
      ctx.strokeStyle=p.color; ctx.lineWidth=p.size;
      ctx.shadowBlur=8; ctx.shadowColor=p.color;
      ctx.beginPath(); ctx.moveTo(-p.size*3,0); ctx.lineTo(p.size*3,0); ctx.stroke();
    } else {
      ctx.fillStyle=p.color;
      ctx.shadowBlur=10; ctx.shadowColor=p.color;
      ctx.beginPath(); ctx.arc(0,0,p.size*a,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
}

/* ══════════════════════════════════════════
   COLLISION BETWEEN TWO ORBS (smooth)
══════════════════════════════════════════ */
function handleOrbCollision(o0, o1){
  if(!o0.alive||!o1.alive) return;
  const dx=o1.x-o0.x, dy=o1.y-o0.y;
  const d=Math.hypot(dx,dy)||1;
  const minD=o0.r+o1.r;
  if(d>=minD) return;

  const overlap=(minD-d)/minD;
  const nx=dx/d, ny=dy/d;
  const force=AR*3.2*overlap;

  /* smooth impulse accumulation, no jitter */
  o0.vx-=nx*force; o0.vy-=ny*force;
  o1.vx+=nx*force; o1.vy+=ny*force;

  /* separate positions gently */
  const sep=(minD-d)*0.5;
  o0.x-=nx*sep*.5; o0.y-=ny*sep*.5;
  o1.x+=nx*sep*.5; o1.y+=ny*sep*.5;

  /* visual impact */
  if(overlap>.06){
    const mx=(o0.x+o1.x)*.5, my=(o0.y+o1.y)*.5;
    spawnShockwave(mx,my,'#ffffff',o0.r*2.2);
    spawnKLines(mx,my,'#ffffff',12,70);
    spawnParticles(mx,my,'#ffffff',8,90,'dot');
    doFreeze(.06);
    o0.hitFlash=Math.max(o0.hitFlash,.6);
    o1.hitFlash=Math.max(o1.hitFlash,.6);
    doFlash('#fff',.18);
  }
}

/* ══════════════════════════════════════════
   HUD UPDATE
══════════════════════════════════════════ */
function updateHUD(){
  orbs.forEach((o,i)=>{
    const p   = PLAYERS[i];
    const pct = Math.max(0, 1 - o.cd/o.maxCd);
    const el  = document.getElementById(`hud${i}`);
    el.innerHTML=`
      <div class="ph-name" style="color:${p.color}">${p.name}</div>
      <div class="ph-tag">${p.sub} — ${p.power}</div>
      <div class="ph-bar-wrap">
        <div class="ph-bar" style="width:${pct*100}%;color:${p.color}"></div>
      </div>
      <div class="ph-kills" style="color:${p.color}">${killsTotal[i]}</div>`;
  });
  document.getElementById('aliveEl').textContent=orbs.filter(o=>o.alive).length;
}

/* ══════════════════════════════════════════
   ROUND MANAGEMENT
══════════════════════════════════════════ */
let orbs=[], round=1, roundState='playing', roundTimer=0;

function initRound(){
  orbs=[];
  const ox = AR*.54;
  orbs.push(new Orb(0, CX-ox, CY));
  orbs.push(new Orb(1, CX+ox, CY));
  orbs[0].vx= AR*.05; orbs[1].vx=-AR*.05;
  roundState='playing'; roundTimer=0;
  document.getElementById('winner').style.opacity='0';
  document.getElementById('round-num').textContent=round;
  document.getElementById('roundEl').textContent=round;
  updateHUD();
}

function onElimination(winner, loser){
  killsTotal[winner]++;
  addKF(winner, loser);
  /* big VFX */
  const lx=orbs[loser].x, ly=orbs[loser].y, lc=PLAYERS[loser].color;
  spawnKLines(lx,ly,lc,32,AR*.55);
  spawnShockwave(lx,ly,lc,AR*.85);
  spawnParticles(lx,ly,lc,55,280,'dot');
  spawnParticles(lx,ly,lc,14,160,'line');
  doFlash(PLAYERS[winner].color,.6);
  doFreeze(.18);
  /* winner screen */
  const wEl=document.getElementById('winner');
  const wNEl=document.getElementById('winner-name');
  wNEl.textContent=PLAYERS[winner].name+' WINS';
  wNEl.style.color=PLAYERS[winner].color;
  wEl.style.opacity='1';
  roundState='end'; roundTimer=0;
}

/* ══════════════════════════════════════════
   MAIN LOOP
══════════════════════════════════════════ */
let last=0, totalT=0;

function loop(ts){
  requestAnimationFrame(loop);
  const raw = Math.min(.033, (ts-last)/1000); last=ts;
  totalT += raw;

  /* freeze frame */
  let dt=raw;
  if(freezeT>0){ freezeT-=raw; dt=raw*.03; }

  /* banner */
  if(bannerT>0){ bannerT-=raw; if(bannerT<=0) bannerEl.style.opacity='0'; }

  /* game */
  if(roundState==='playing'){
    const [o0,o1]=orbs;
    if(o0.alive) o0.step(dt,o1);
    if(o1.alive) o1.step(dt,o0);
    handleOrbCollision(o0,o1);

    if(!o0.alive && !o1.alive){ round++; initRound(); }
    else if(!o0.alive) onElimination(1,0);
    else if(!o1.alive) onElimination(0,1);

    updateHUD();
  }
  if(roundState==='end'){
    roundTimer+=raw;
    if(roundTimer>=4){ round++; initRound(); }
  }

  tickEffects(raw);

  /* ─── RENDER ─── */
  drawArena(totalT);
  drawEffects();
  orbs.forEach(o=>o.draw());

  /* flash overlay */
  if(flashA>0){
    ctx.save();
    ctx.globalAlpha=flashA*.8;
    ctx.fillStyle=flashCol;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
    flashA=Math.max(0, flashA-raw*9);
  }
}

/* ══════════════════════════════════════════
   INTRO
══════════════════════════════════════════ */
const introEl   = document.getElementById('intro');
const iPlayers  = document.getElementById('intro-players');
PLAYERS.forEach((p,i)=>{
  const d=document.createElement('div');
  d.className='ip';
  d.innerHTML=`<div class="ip-orb" style="background:${p.color};color:${p.color}"></div>`
             +`<div class="ip-name" style="color:${p.color}">${p.name}</div>`
             +`<div class="ip-style">${p.sub}</div>`;
  iPlayers.appendChild(d);
});

setTimeout(()=>{
  introEl.style.opacity='0';
  setTimeout(()=>introEl.style.display='none', 1200);
}, 3000);

initRound();
requestAnimationFrame(t=>{ last=t; loop(t); });
</script>
