<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Orbitron',sans-serif}canvas{display:block}#flash{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:50;transition:opacity.07s}#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(90,0,140,.3),rgba(0,0,0,.95));transition:opacity.9s}#intro-title{font-size:clamp(42px,9vw,90px);font-weight:900;letter-spacing:8px;color:#fff;text-shadow:0 0 20px #bb00ff,0 0 60px #bb00ff}#intro-sub{margin-top:16px;font-size:14px;letter-spacing:7px;color:#cc99ff;font-family:'Share Tech Mono',monospace}#intro-orbs{margin-top:48px;display:flex;gap:32px;align-items:center}.intro-dot{width:22px;height:22px;border-radius:50%;box-shadow:0 0 14px currentColor,0 0 30px currentColor}#intro-start{margin-top:32px;font-size:12px;letter-spacing:5px;color:#888;font-family:'Share Tech Mono',monospace;animation:blink 1.2s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px 26px;background:linear-gradient(180deg,rgba(0,0,0,.88),transparent)}#logo{font-size:20px;font-weight:900;letter-spacing:4px;color:#fff;text-shadow:0 12px #bb00ff,0 0 30px #bb00ff}#round-badge{font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:3px;color:#d5b2ff;border:1px solid rgba(200,120,255,.4);padding:9px 20px;border-radius:999px;background:rgba(50,0,80,.35);backdrop-filter:blur(10px)}#event-text{position:fixed;top:17%;left:50%;transform:translateX(-50%);z-index:20;font-size:28px;font-weight:900;letter-spacing:5px;color:#fff;text-shadow:0 0 20px currentColor;opacity:0;pointer-events:none;transition:opacity.18s;white-space:nowrap}#scoreboard{position:fixed;top:90px;left:18px;z-index:20;display:flex;flex-direction:column;gap:9px}.s-row{min-width:200px;padding:10px 14px;border-radius:14px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,.07);backdrop-filter:blur(10px);border-left:3px solid var(--c);transition:opacity.3s,filter.3s}.s-row.dead{opacity:.2;filter:grayscale(1)}.s-name{font-size:11px;font-weight:700;letter-spacing:2px;color:#fff}.s-power{margin-top:4px;font-size:9px;font-family:'Share Tech Mono',monospace;color:var(--c);letter-spacing:1px}.s-kills{margin-top:6px;font-size:17px;font-weight:900;color:var(--c);text-shadow:0 0 8px var(--c)}.s-streak{font-size:9px;color:#ffcc00;letter-spacing:1px;margin-top:2px}#killfeed{position:fixed;top:90px;right:18px;z-index:20;display:flex;flex-direction:column;gap:6px;align-items:flex-end}.kf{font-size:11px;font-family:'Share Tech Mono',monospace;background:rgba(0,0,0,.8);padding:5px 13px;border-radius:7px;border-right:3px solid var(--c);animation:kfIn.2s ease;transition:opacity 1s}@keyframes kfIn{from{transform:translateX(18px);opacity:0}to{transform:translateX(0);opacity:1}}#winner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;text-align:center;opacity:0;pointer-events:none;transition:opacity.3s}#winner-name{font-size:clamp(44px,9vw,82px);font-weight:900;letter-spacing:8px;text-shadow:0 0 30px currentColor,0 0 70px currentColor;line-height:1}#winner-sub{margin-top:14px;color:#fff;opacity:.65;font-family:'Share Tech Mono',monospace;letter-spacing:6px;font-size:13px}#bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:44px;padding:13px;background:linear-gradient(0deg,rgba(0,0,0,.88),transparent);color:#888;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px}.stat span{color:#d5b2ff}</style>
</head>
<body>
<div id="flash"></div>
<div id="intro"><div id="intro-title">BLACKHOLE ARENA</div><div id="intro-sub">MODULAR ENGINE</div><div id="intro-orbs"></div><div id="intro-start">⚫ INITIALIZING VOID ⚫</div></div>
<div id="topbar"><div id="logo">⚫ BLACKHOLE ARENA</div><div id="round-badge">ROUND <span id="roundNum">1</span></div></div>
<div id="event-text"></div><div id="scoreboard"></div><div id="killfeed"></div>
<div id="winner"><div id="winner-name"></div><div id="winner-sub">DOMINATES THE VOID</div></div>
<div id="bottom"><div class="stat">ALIVE <span id="alive">0</span></div><div class="stat">ROUND <span id="roundStat">1</span></div><div class="stat">KILLS <span id="totalKillsEl">0</span></div></div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import { CONFIG } from './arena-config.js';

const C=CONFIG, CA=C.arena, CC=C.camera, CR=C.round, CO=C.orb, CV=C.visual, PW=C.powers;
const HALF=CA.radius;

const scene=new THREE.Scene(); scene.background=new THREE.Color(CV.bgColor); scene.fog=new THREE.FogExp2(CV.fogColor,CV.fogDensity);
const camera=new THREE.PerspectiveCamera(CC.fov,innerWidth/innerHeight,.1,200); camera.position.set(0,CC.height,CC.orbitRadius);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x441166,1.6)); scene.add(new THREE.HemisphereLight(0xaa66ff,0x110011,2));
const sun=new THREE.DirectionalLight(0xffffff,1.5); sun.position.set(10,20,10); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.left=sun.shadow.camera.bottom=-22; sun.shadow.camera.right=sun.shadow.camera.top=22; scene.add(sun);

const sGeo=new THREE.BufferGeometry(); const sArr=new Float32Array(CV.starCount*3); for(let i=0;i<sArr.length;i++) sArr[i]=(Math.random()-.5)*400; sGeo.setAttribute('position',new THREE.BufferAttribute(sArr,3)); const stars=new THREE.Points(sGeo,new THREE.PointsMaterial({color:0xffffff,size:CV.starSize,transparent:true,opacity:.8})); scene.add(stars);

const world=new CANNON.World({gravity:new CANNON.Vec3(0,CA.gravity,0)});
world.solver.iterations = 20;
world.solver.tolerance = 0.001;

const orbMat = new CANNON.Material('orb');
const floorMat = new CANNON.Material('floor');

world.addContactMaterial(new CANNON.ContactMaterial(orbMat, orbMat, {
  friction: 0.02,
  restitution: 0.65,
  contactEquationStiffness: 1e8,
  contactEquationRelaxation: 3
}));
world.addContactMaterial(new CANNON.ContactMaterial(orbMat, floorMat, {
  friction: CA.friction || 0.05,
  restitution: 0.05
}));

const floorBody=new CANNON.Body({mass:0,shape:new CANNON.Plane(),material:floorMat});
floorBody.quaternion.setFromEuler(-Math.PI/2,0,0); world.addBody(floorBody);

const floorMesh=new THREE.Mesh(new THREE.CircleGeometry(HALF,72),new THREE.MeshStandardMaterial({color:CV.floorColor,emissive:CV.floorEmissive,emissiveIntensity:CV.floorEmissiveInt,metalness:.7,roughness:.15})); floorMesh.rotation.x=-Math.PI/2; floorMesh.receiveShadow=true; scene.add(floorMesh);
[.35,.65,.88].forEach(f=>{const m=new THREE.Mesh(new THREE.TorusGeometry(HALF*f,.025,8,80),new THREE.MeshBasicMaterial({color:0x6600bb,transparent:true,opacity:.35})); m.rotation.x=Math.PI/2; scene.add(m);});
const rimRing=new THREE.Mesh(new THREE.TorusGeometry(HALF,.14,16,120),new THREE.MeshBasicMaterial({color:CV.rimColor})); rimRing.rotation.x=Math.PI/2; scene.add(rimRing);
const dangerRing=new THREE.Mesh(new THREE.TorusGeometry(HALF+.6,.08,8,120),new THREE.MeshBasicMaterial({color:CV.dangerColor,transparent:true,opacity:.35})); dangerRing.rotation.x=Math.PI/2; scene.add(dangerRing);
for(let i=0;i<4;i++){const a=(i/4)*Math.PI*2; const pl=new THREE.PointLight(0xaa00ff,1.5,10); pl.position.set(Math.cos(a)*HALF,1.5,Math.sin(a)*HALF); scene.add(pl);}
const vortex1=new THREE.Mesh(new THREE.TorusGeometry(1.2,.05,12,60),new THREE.MeshBasicMaterial({color:CV.vortex1Color||0xcc44ff,transparent:true,opacity:.65})); vortex1.rotation.x=Math.PI/2; scene.add(vortex1);
const vortex2=new THREE.Mesh(new THREE.TorusGeometry(2.1,.03,8,60),new THREE.MeshBasicMaterial({color:CV.vortex2Color||0x8800aa,transparent:true,opacity:.35})); vortex2.rotation.x=Math.PI/2; scene.add(vortex2);

const totalKills=C.players.map(()=>0); const totalStreak=C.players.map(()=>0);
let orbs=[],particles=[],effects=[],minions=[]; let round=1,roundWon=false,roundTimer=0,slowMo=1;
const hex=c=>'#'+c.toString(16).padStart(6,'0');

const introOrbs=document.getElementById('intro-orbs'); C.players.forEach(p=>{const d=document.createElement('div'); d.className='intro-dot'; d.style.background=hex(p.color); d.style.color=hex(p.color); introOrbs.appendChild(d);});
setTimeout(()=>{const el=document.getElementById('intro'); el.style.opacity='0'; setTimeout(()=>el.style.display='none',900);},CR.introDuration);

const flashEl=document.getElementById('flash'); function doFlash(c='#fff',v=.7){flashEl.style.background=c;flashEl.style.opacity=v;setTimeout(()=>flashEl.style.opacity='0',90);}
function cameraShake(s=.3){camera.position.x+=(Math.random()-.5)*s;camera.position.y+=(Math.random()-.5)*s*.5;}
const evEl=document.getElementById('event-text'); let evTimer=0; function showEvent(t,c='#fff',d=1.6){evEl.textContent=t;evEl.style.color=c;evEl.style.textShadow=`0 20px ${c}`;evEl.style.opacity='1';evTimer=d;}
function burst(pos,color,count=35,force=10){for(let i=0;i<count;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.06+Math.random()*.12,6,6),new THREE.MeshBasicMaterial({color,transparent:true,opacity:1})); const a=Math.random()*Math.PI*2,sp=force*.5+Math.random()*force; m.position.copy(pos); scene.add(m); particles.push({mesh:m,vx:Math.cos(a)*sp,vy:1+Math.random()*5,vz:Math.sin
