<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>BLACKHOLE ARENA — CINEMATIC EDITION</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<script type="importmap">
{
  "imports": {
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:'Orbitron',sans-serif;
}

canvas{
  display:block;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:10;
}

#topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:18px 26px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);
}

#logo{
  color:#fff;
  font-size:24px;
  font-weight:900;
  letter-spacing:4px;
  text-shadow:
    0 0 10px #bb00ff,
    0 0 30px #bb00ff,
    0 0 70px #bb00ff;
}

#round{
  color:#d5b2ff;
  font-family:'Share Tech Mono',monospace;
  font-size:13px;
  letter-spacing:3px;
  border:1px solid rgba(200,120,255,.4);
  padding:10px 18px;
  border-radius:999px;
  background:rgba(50,0,80,.3);
  backdrop-filter:blur(10px);
}

#intro{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:radial-gradient(circle at center,rgba(80,0,120,.25),rgba(0,0,0,.92));
  transition:opacity .8s;
}

#intro-title{
  color:#fff;
  font-size:72px;
  font-weight:900;
  letter-spacing:8px;
  text-shadow:
    0 0 20px #bb00ff,
    0 0 60px #bb00ff,
    0 0 120px #bb00ff;
}

#intro-sub{
  margin-top:18px;
  color:#c9c9c9;
  letter-spacing:6px;
  font-size:14px;
  font-family:'Share Tech Mono',monospace;
}

#vs{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:90px;
  font-weight:900;
  color:#fff;
  opacity:0;
  transition:.4s;
  text-shadow:0 0 40px #fff;
}

#eventText{
  position:absolute;
  top:18%;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  font-size:30px;
  font-weight:900;
  letter-spacing:5px;
  opacity:0;
  transition:.2s;
  text-shadow:0 0 25px currentColor;
}

#scoreboard{
  position:absolute;
  top:100px;
  left:18px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.row{
  min-width:200px;
  padding:10px 14px;
  border-radius:14px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
}

.row.dead{
  opacity:.25;
  filter:grayscale(1);
}

.name{
  font-size:12px;
  color:#fff;
  font-weight:700;
  letter-spacing:2px;
}

.power{
  margin-top:5px;
  font-size:10px;
  font-family:'Share Tech Mono',monospace;
}

.kills{
  margin-top:6px;
  font-size:18px;
  font-weight:900;
}

#winner{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  opacity:0;
  transition:opacity .3s;
}

#winner-name{
  font-size:82px;
  font-weight:900;
  letter-spacing:8px;
}

#winner-sub{
  margin-top:14px;
  color:#fff;
  opacity:.7;
  font-family:'Share Tech Mono',monospace;
  letter-spacing:6px;
}

#flash{
  position:absolute;
  inset:0;
  opacity:0;
  transition:.08s;
}

#bottom{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:40px;
  padding:14px;
  background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);
  color:#999;
  font-family:'Share Tech Mono',monospace;
  letter-spacing:2px;
}

.stat span{
  color:#fff;
}
</style>
</head>
<body>

<div id="ui">

  <div id="flash"></div>

  <div id="intro">
    <div id="intro-title">BLACKHOLE ARENA</div>
    <div id="intro-sub">CINEMATIC EDITION</div>
  </div>

  <div id="vs">VS</div>

  <div id="topbar">
    <div id="logo">⚫ BLACKHOLE ARENA</div>
    <div id="round">ROUND <span id="roundNum">1</span></div>
  </div>

  <div id="eventText"></div>

  <div id="scoreboard"></div>

  <div id="winner">
    <div id="winner-name"></div>
    <div id="winner-sub">DOMINATES THE VOID</div>
  </div>

  <div id="bottom">
    <div class="stat">ALIVE <span id="alive">4/4</span></div>
    <div class="stat">TOTAL KILLS <span id="kills">0</span></div>
  </div>

</div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020008);
scene.fog = new THREE.FogExp2(0x160024,0.022);

const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);
camera.position.set(0,16,22);

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x441166,1.6));
scene.add(new THREE.HemisphereLight(0xaa66ff,0x110011,2));

const sun = new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(10,20,10);
sun.castShadow=true;
scene.add(sun);

const world = new CANNON.World({
  gravity:new CANNON.Vec3(0,-28,0)
});

const mat = new CANNON.Material();
world.defaultContactMaterial = new CANNON.ContactMaterial(mat,mat,{
  friction:.04,
  restitution:.8
});

const HALF = 8;

const floorBody = new CANNON.Body({
  mass:0,
  shape:new CANNON.Plane(),
  material:mat
});

floorBody.quaternion.setFromEuler(-Math.PI/2,0,0);
world.addBody(floorBody);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(HALF,64),
  new THREE.MeshStandardMaterial({
    color:0x180022,
    emissive:0x7700ff,
    emissiveIntensity:.25,
    metalness:.7,
    roughness:.15
  })
);

floor.rotation.x = -Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const ring = new THREE.Mesh(
  new THREE.TorusGeometry(HALF,.15,16,120),
  new THREE.MeshBasicMaterial({
    color:0xcc00ff
  })
);

ring.rotation.x=Math.PI/2;
scene.add(ring);

const starsGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(4000*3);

for(let i=0;i<starPos.length;i++){
  starPos[i]=(Math.random()-.5)*400;
}

starsGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));

const stars = new THREE.Points(
  starsGeo,
  new THREE.PointsMaterial({
    color:0xffffff,
    size:.35,
    transparent:true,
    opacity:.8
  })
);

scene.add(stars);

const ORBS = [
  {name:'ROSSO',color:0xff3355,power:'EXPLOSION'},
  {name:'BLU',color:0x3388ff,power:'MINION'},
  {name:'VERDE',color:0x33ff88,power:'GHOST'},
  {name:'VIOLA',color:0xdd44ff,power:'BLACKHOLE'}
];

const orbs=[];
const particles=[];
const totalKills=[0,0,0,0];

function flash(color='#fff',v=.7){
  const f=document.getElementById('flash');
  f.style.background=color;
  f.style.opacity=v;
  setTimeout(()=>f.style.opacity='0',90);
}

function showEvent(text,color='#fff'){
  const el=document.getElementById('eventText');
  el.innerHTML=text;
  el.style.color=color;
  el.style.opacity='1';
  setTimeout(()=>el.style.opacity='0',1500);
}

function burst(pos,color,count=35){
  for(let i=0;i<count;i++){

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(.07+Math.random()*.12,6,6),
      new THREE.MeshBasicMaterial({
        color,
        transparent:true,
        opacity:1
      })
    );

    mesh.position.copy(pos);
    scene.add(mesh);

    particles.push({
      mesh,
      vx:(Math.random()-.5)*12,
      vy:Math.random()*8,
      vz:(Math.random()-.5)*12,
      life:1
    });
  }
}

function makeOrb(i,x,z){

  const cfg = ORBS[i];

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(.55,32,32),
    new THREE.MeshStandardMaterial({
      color:cfg.color,
      emissive:cfg.color,
      emissiveIntensity:1,
      roughness:.18,
      metalness:.2
    })
  );

  mesh.castShadow=true;
  scene.add(mesh);

  mesh.add(new THREE.PointLight(cfg.color,2,6));

  const body = new CANNON.Body({
    mass:3,
    shape:new CANNON.Sphere(.55),
    material:mat,
    linearDamping:.05
  });

  body.position.set(x,1,z);
  world.addBody(body);

  return {
    id:i,
    mesh,
    body,
    alive:true,
    cooldown:2+Math.random()*3,
    dash:1,
    kills:0,
    personality:Math.random()
  };
}

function spawn(){
  orbs.length=0;

  orbs.push(makeOrb(0,-4,4));
  orbs.push(makeOrb(1,4,-4));
  orbs.push(makeOrb(2,-4,-4));
  orbs.push(makeOrb(3,4,4));
}

spawn();

function updateBoard(){

  const sb = document.getElementById('scoreboard');
  sb.innerHTML='';

  orbs.forEach(o=>{

    const cfg=ORBS[o.id];

    const row=document.createElement('div');
    row.className='row'+(!o.alive?' dead':'');

    row.innerHTML=`
      <div class="name" style="color:${'#'+cfg.color.toString(16)}">
        ${cfg.name}
      </div>

      <div class="power">
        ${cfg.power}
      </div>

      <div class="kills">
        ${totalKills[o.id]}
      </div>
    `;

    sb.appendChild(row);
  });
}

function cameraShake(intensity=.2){
  camera.position.x += (Math.random()-.5)*intensity;
  camera.position.y += (Math.random()-.5)*intensity;
  camera.position.z += (Math.random()-.5)*intensity;
}

function powerExplosion(o){

  showEvent('💥 EXPLOSION','#ff3355');
  flash('#ff3355',.6);
  cameraShake(.7);

  burst(o.mesh.position,o.mesh.material.color,60);

  orbs.forEach(t=>{

    if(!t.alive||t===o)return;

    const dx=t.body.position.x-o.body.position.x;
    const dz=t.body.position.z-o.body.position.z;

    const d=Math.max(.2,Math.hypot(dx,dz));

    t.body.velocity.x += (dx/d)*22;
    t.body.velocity.z += (dz/d)*22;
  });
}

function powerBlackhole(o){

  showEvent('🕳️ BLACKHOLE','#dd44ff');
  flash('#dd44ff',.45);

  const pos = o.body.position.clone();

  const blackhole = new THREE.Mesh(
    new THREE.SphereGeometry(.45,32,32),
    new THREE.MeshBasicMaterial({color:0x000000})
  );

  blackhole.position.copy(pos);
  scene.add(blackhole);

  let timer=2.4;

  const pull = ()=>{

    timer-=0.016;

    blackhole.rotation.y += .1;

    orbs.forEach(t=>{

      if(!t.alive)return;

      const dx=pos.x-t.body.position.x;
      const dz=pos.z-t.body.position.z;

      const d=Math.max(.5,Math.hypot(dx,dz));

      t.body.velocity.x += dx/d*.45;
      t.body.velocity.z += dz/d*.45;
    });

    if(timer>0){
      requestAnimationFrame(pull);
    }else{
      scene.remove(blackhole);
    }
  };

  pull();
}

function ai(o,dt){

  if(!o.alive)return;

  o.cooldown-=dt;
  o.dash-=dt;

  const enemies = orbs.filter(t=>t.alive&&t!==o);

  if(!enemies.length)return;

  let target=enemies[0];
  let best=999;

  enemies.forEach(e=>{
    const d=o.body.position.distanceTo(e.body.position);
    if(d<best){
      best=d;
      target=e;
    }
  });

  const dx=target.body.position.x-o.body.position.x;
  const dz=target.body.position.z-o.body.position.z;

  const dist=Math.max(.001,Math.hypot(dx,dz));

  const speed = 7 + o.personality*4;

  o.body.velocity.x += dx/dist*speed*dt*8;
  o.body.velocity.z += dz/dist*speed*dt*8;

  const edge=Math.max(Math.abs(o.body.position.x),Math.abs(o.body.position.z));

  if(edge>5.5){
    o.body.velocity.x += -o.body.position.x*.2;
    o.body.velocity.z += -o.body.position.z*.2;
  }

  if(o.cooldown<=0){

    if(o.id===0) powerExplosion(o);
    if(o.id===3) powerBlackhole(o);

    o.cooldown=3+Math.random()*3;
  }
}

function eliminate(o){

  o.alive=false;

  burst(o.mesh.position,o.mesh.material.color,70);
  flash('#ffffff',.4);
  cameraShake(1.2);

  scene.remove(o.mesh);

  try{
    world.removeBody(o.body);
  }catch(e){}
}

let round=1;
let winner=false;
let slowmo=1;

const winnerEl=document.getElementById('winner');
const winnerName=document.getElementById('winner-name');

const clock = new THREE.Clock();

setTimeout(()=>{
  document.getElementById('intro').style.opacity='0';
  setTimeout(()=>{
    document.getElementById('intro').style.display='none';
  },1000);
},2600);

function loop(){

  requestAnimationFrame(loop);

  const dt=Math.min(.033,clock.getDelta())*slowmo;

  world.step(1/60,dt,3);

  stars.rotation.y += .0002;
  ring.rotation.z += .001;

  const t=performance.now()*.0002;

  camera.position.x = Math.sin(t)*24;
  camera.position.z = Math.cos(t)*24;
  camera.position.y = 14 + Math.sin(t*2)*2;
  camera.lookAt(0,1,0);

  particles.forEach((p,i)=>{

    p.life -= dt;

    p.mesh.position.x += p.vx*dt;
    p.mesh.position.y += p.vy*dt;
    p.mesh.position.z += p.vz*dt;

    p.vy -= 12*dt;

    p.mesh.material.opacity = p.life;

    if(p.life<=0){
      scene.remove(p.mesh);
      particles.splice(i,1);
    }
  });

  orbs.forEach(o=>{

    if(!o.alive)return;

    o.mesh.position.copy(o.body.position);

    o.mesh.rotation.y += dt*3;

    ai(o,dt);

    const p=o.body.position;

    if(Math.abs(p.x)>HALF||Math.abs(p.z)>HALF||p.y<-2){
      eliminate(o);
    }
  });

  const alive = orbs.filter(o=>o.alive);

  document.getElementById('alive').innerHTML=`${alive.length}/4`;
  document.getElementById('kills').innerHTML=totalKills.reduce((a,b)=>a+b,0);

  if(!winner && alive.length===1){

    winner=true;

    slowmo=.25;

    const w=alive[0];

    totalKills[w.id]++;

    winnerEl.style.opacity='1';
    winnerName.innerHTML=ORBS[w.id].name;
    winnerName.style.color='#'+ORBS[w.id].color.toString(16);

    setTimeout(()=>{

      winnerEl.style.opacity='0';
      slowmo=1;
      round++;

      orbs.forEach(o=>{
        try{world.removeBody(o.body)}catch(e){}
        scene.remove(o.mesh);
      });

      spawn();

      winner=false;

      document.getElementById('roundNum').innerHTML=round;

    },4000);
  }

  updateBoard();

  renderer.render(scene,camera);
}

loop();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
