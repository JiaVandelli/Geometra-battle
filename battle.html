<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>ILLUSORE vs BATTERIO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a}
canvas{position:fixed;inset:0;width:100%;height:100%}

#flash{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:50;transition:opacity 0.07s}
#event-text{position:fixed;top:20%;left:50%;transform:translateX(-50%);z-index:20;font-size:28px;font-weight:900;letter-spacing:5px;color:#fff;text-shadow:0 0 20px currentColor;opacity:0;pointer-events:none;transition:opacity 0.18s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="event-text"></div>

<script>
/* ══════════
   CONFIG PULITO
══════════ */
const CONFIG = {
  arena: { radius: 8 },
  players: [
    { name: 'ILLUSORE', color: '#c77dff', power: 'mirage', cd: 4.2 },
    { name: 'BATTERIO', color: '#00ff88', power: 'hive', cd: 4.2 },
  ],
};

/* ══════════
   SETUP
══════════ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, CX, CY, AR;
let freezeT = 0;
let flashA = 0;

function resize(){
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  CX = W / 2;
  CY = H / 2;
  const size = Math.min(W, H);
  AR = size * 0.34; // <--- MODIFICA 1: Arena più piccola
}
resize();
window.addEventListener('resize', resize);

/* ══════════
   UI HELPERS
══════════ */
const flashEl = document.getElementById('flash');
function doFlash(c='#fff',v=.7){
  flashEl.style.background=c;
  flashEl.style.opacity=v;
  setTimeout(()=>flashEl.style.opacity='0',90);
}

const evEl=document.getElementById('event-text');
let evTimer=0;
function showEvent(t,c='#fff',d=1.6){
  evEl.textContent=t;
  evEl.style.color=c;
  evEl.style.textShadow=`0 0 20px ${c}`;
  evEl.style.opacity='1';
  evTimer=d;
}

/* ══════════
   ORB CLASS
══════════ */
class Orb {
  constructor(id, x, y){
    this.id = id;
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;

    const p = CONFIG.players[id];
    this.color = p.color;
    this.power = p.power;
    this.cd = p.cd * (.3 + Math.random()*.4);
    this.maxCd = p.cd;

    this.style = p.power === 'mirage'? 'berserker' : 'trickster';
    this.trail = [];
    this.pulseT = Math.random()*Math.PI*2;
    this.squishX = 1;
    this.squishY = 1;

    this.state = 'idle';
    this.stateT = 0;
    this.anger = 0;
    this.fear = 0;
    this.feintDir= 1;
    this.feintAmt= 0;

    this.intangible = false;
    this.intangibleTime = 0;
    this.swarm = [];
    this.opacity = 1;
  }

  get r(){ return AR * 0.075; }

  // MODIFICA 2: Velocità ridotta
  get baseSpeed(){
    return this.style === 'berserker'? AR * 1.25 : AR * 0.9;
  }

  get speed(){
    const bs = this.baseSpeed;
    if(this.style==='berserker'){
      if(this.state==='charge') return bs * (2.4 + this.anger*.5);
      return bs * (1.05 + this.anger*.2);
    }
    if(this.state==='charge') return bs * 2.4;
    if(this.state==='idle') return bs *.7;
    return bs *.9;
  }

  setState(s, dur){ this.state=s; this.stateT=dur; }

  fireMirage(enemy){
    showEvent('🟣 PHASE WALK', this.color, 1.2);
    doFlash(this.color, 0.28);
    this.intangible = true;
    this.intangibleTime = 0;
    this.opacity = 0.35;
    const dx = enemy.x - this.x;
    const dy = enemy.y - this.y;
    const dist = Math.hypot(dx,dy);
    if(dist < this.r * 4){
      enemy.vx += (dx/dist) * AR * 1.2;
      enemy.vy += (dy/dist) * AR * 1.2;
    }
  }

  fireHive(){
    showEvent('🦠 ABSORB SWARM', this.color, 1.2);
    doFlash(this.color, 0.28);
    for(let i=0; i<3; i++){
      const angle = (i/3) * Math.PI*2;
      this.swarm.push({
        angle: angle,
        dist: this.r * 1.8,
        speed: 0.05,
        life: 5,
        maxLife: 5,
        angularSpeed: 0.5,
        // MODIFICA 4: aggiunti per AI swarm
        mode: 'orbit',
        x: this.x,
        y: this.y,
        vx: 0,
        vy: 0
      });
    }
  }

  aiBerserker(dt, ex, ey){
    this.stateT -= dt;
    const dx = ex - this.x, dy = ey - this.y;
    const dist = Math.hypot(dx,dy)||1;
    const dn = dist / AR;
    this.anger = Math.min(1,.5);

    if(this.stateT<=0){
      if(dn<.3 && Math.random()<.6) this.setState('charge',.2);
      else if(dn<.25 && Math.random()<.4) this.setState('evade',.2);
      else this.setState('chase',.3);
    }

    let fx=0, fy=0;
    if(this.state==='chase'){
      fx = (dx/dist)*this.speed;
      fy = (dy/dist)*this.speed;
    } else if(this.state==='charge'){
      fx = (dx/dist)*this.speed*1.5;
      fy = (dy/dist)*this.speed*1.5;
    } else if(this.state==='evade'){
      fx = -(dy/dist)*this.speed*.8;
      fy = (dx/dist)*this.speed*.8;
    }

    const myR = Math.hypot(this.x-CX, this.y-CY);
    const edgeT = Math.max(0,(myR - AR*.8)/(AR*.2));
    if(edgeT>0){
      fx += ((CX-this.x)/AR)*this.speed*edgeT*2;
      fy += ((CY-this.y)/AR)*this.speed*edgeT*2;
    }

    // MODIFICA 3: Accelerazione ridotta per peso
    const acc = this.state==='charge'?10:6;
    this.vx += (fx - this.vx)*Math.min(1, acc*dt);
    this.vy += (fy - this.vy)*Math.min(1, acc*dt);

    const s = Math.hypot(this.vx,this.vy);
    const t = Math.min(1, s/(this.speed*1.3));
    this.squishX = 1 - t*.15;
    this.squishY = 1 + t*.15;
  }

  aiTrickster(dt, ex, ey){
    this.stateT -= dt;
    const dx = ex - this.x, dy = ey - this.y;
    const dist = Math.hypot(dx,dy)||1;
    const dn = dist / AR;
    const myR = Math.hypot(this.x-CX, this.y-CY);

    this.fear = Math.max(0,(myR - AR*.7)/(AR*.3));

    if(this.stateT<=0){
      if(this.fear>.6) this.setState('evade',.3);
      else if(dn<.4 && Math.random()<.5) this.setState('charge',.25);
      else if(dn<.35 && Math.random()<.5){
        this.setState('feint',.35);
        this.feintDir = Math.random()<.5?1:-1;
        this.feintAmt =.6;
      } else {
        this.setState('orbit',.4);
      }
    }

    let fx=0, fy=0;
    if(this.state==='orbit'){
      const ang = Math.atan2(this.y-CY, this.x-CX);
      fx = -Math.sin(ang)*this.speed*.7;
      fy = Math.cos(ang)*this.speed*.7;
    } else if(this.state==='feint'){
      fx = (-dy/dist)*this.feintDir*this.speed*this.feintAmt;
      fy = (dx/dist)*this.feintDir*this.speed*this.feintAmt;
    } else if(this.state==='charge'){
      fx = (dx/dist)*this.speed*1.3;
      fy = (dy/dist)*this.speed*1.3;
    } else if(this.state==='evade'){
      fx = -((this.x-CX)/AR)*this.speed*1.5;
      fy = -((this.y-CY)/AR)*this.speed*1.5;
    }

    // MODIFICA 3: Accelerazione ridotta per peso
    const acc=this.state==='charge'?8:4;
    this.vx+=(fx-this.vx)*Math.min(1,acc*dt);
    this.vy+=(fy-this.vy)*Math.min(1,acc*dt);

    const s=Math.hypot(this.vx,this.vy);
    const t=Math.min(1,s/(this.speed*1.2));
    this.squishX=1-t*.12;
    this.squishY=1+t*.12;
  }

  step(dt, enemy){
    this.pulseT += dt*3;
    this.cd = Math.max(0, this.cd-dt);

    if(this.cd <= 0){
      if(this.power === 'mirage') this.fireMirage(enemy);
      if(this.power === 'hive') this.fireHive();
      this.cd = this.maxCd;
    }

    if(this.intangible){
      this.intangibleTime += dt;
      if(this.intangibleTime >= 1.2){
        this.intangible = false;
        this.opacity = 1;
      }
    }

    // MODIFICA 4: Swarm ATTIVO con homing
    this.swarm = this.swarm.filter(s=>{
      // inizializzazione
      if(!s.mode){
        s.mode = 'orbit';
        s.x = this.x;
        s.y = this.y;
        s.vx = 0;
        s.vy = 0;
      }

      // tempo vita
      s.life -= dt;

      // dopo 1 secondo ATTACCA
      if(s.life < s.maxLife - 1.0){
        s.mode = 'attack';
      }

      if(s.mode === 'orbit'){
        s.angle += s.angularSpeed * dt;
        const tx = this.x + Math.cos(s.angle)*s.dist;
        const ty = this.y + Math.sin(s.angle)*s.dist;
        s.x += (tx - s.x)*dt*8;
        s.y += (ty - s.y)*dt*8;
      } else {
        // HOMING SULL'AVVERSARIO
        const dx = enemy.x - s.x;
        const dy = enemy.y - s.y;
        const d = Math.hypot(dx,dy)||1;
        s.vx += (dx/d) * AR * 0.9 * dt;
        s.vy += (dy/d) * AR * 0.9 * dt;
        // damping
        s.vx *= 0.98;
        s.vy *= 0.98;
        s.x += s.vx;
        s.y += s.vy;
      }
      return s.life > 0;
    });

    if(this.style==='berserker') this.aiBerserker(dt, enemy.x, enemy.y);
    else this.aiTrickster(dt, enemy.x, enemy.y);

    if(this.intangible) return;

    const spd = Math.hypot(this.vx,this.vy);
    const maxSpd = this.speed * 2;
    if(spd>maxSpd){ this.vx=this.vx/spd*maxSpd; this.vy=this.vy/spd*maxSpd; }

    this.x += this.vx*dt;
    this.y += this.vy*dt;

    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>40) this.trail.shift();

    const distFromCenter = Math.hypot(this.x-CX, this.y-CY);
    if(distFromCenter > AR - this.r){
      const nx = (this.x-CX)/distFromCenter;
      const ny = (this.y-CY)/distFromCenter;
      const dot = this.vx*nx + this.vy*ny;
      this.vx -= 2*dot*nx*0.8;
      this.vy -= 2*dot*ny*0.8;
      this.x = CX + nx*(AR-this.r);
      this.y = CY + ny*(AR-this.r);
    }
  }

  draw(){
    const r = this.r * (1 + Math.sin(this.pulseT)*.04);
    const ang = Math.atan2(this.vy,this.vx);

    // Trail
    ctx.save();
    for(let i=1;i<this.trail.length;i++){
      const t = i/this.trail.length;
      ctx.beginPath();
      ctx.moveTo(this.trail[i-1].x,this.trail[i-1].y);
      ctx.lineTo(this.trail[i].x,this.trail[i].y);
      ctx.strokeStyle = this.color;
      ctx.lineWidth = r*.3 * t;
      ctx.globalAlpha = t *.4 * this.opacity;
      ctx.stroke();
    }
    ctx.restore();

    // MODIFICA 4+5: Swarm con posizione corretta
    this.swarm.forEach(s=>{
      const sx = s.x;
      const sy = s.y;
      ctx.save();
      ctx.globalAlpha = s.life/s.maxLife * this.opacity;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(sx, sy, r*0.3, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    });

    ctx.save();
    ctx.globalAlpha = this.opacity;
    ctx.translate(this.x, this.y);
    ctx.rotate(ang);
    ctx.scale(this.squishX, this.squishY);
    ctx.rotate(-ang);

    // MODIFICA 6: Clone spettrale per Illusore
    if(this.id === 0 && this.intangible){
      ctx.save();
      const ghostX = this.x - this.vx * 0.08;
      const ghostY = this.y - this.vy * 0.08;
      ctx.globalAlpha = 0.35;
      const ghostGrad = ctx.createRadialGradient(
        ghostX, ghostY, 0, ghostX, ghostY, r*1.4
      );
      ghostGrad.addColorStop(0,'#ffffff');
      ghostGrad.addColorStop(0.2,'#f4aaff');
      ghostGrad.addColorStop(1,'rgba(180,120,255,0)');
      ctx.fillStyle = ghostGrad;
      ctx.beginPath();
      ctx.arc(ghostX, ghostY, r*1.15, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // MODIFICA 7: Sfera con profondità
    const grd=ctx.createRadialGradient(-r*.3,-r*.3,r*.05,0,0,r);
    grd.addColorStop(0,'#fff');
    grd.addColorStop(.2,this.color);
    grd.addColorStop(1,'rgba(0,0,0,.8)');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

    // CORE INTERNO
    ctx.beginPath();
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.arc(-r*0.18,-r*0.18,r*0.28,0,Math.PI*2);
    ctx.fill();

    // ANELLO ENERGETICO
    ctx.strokeStyle='rgba(255,255,255,0.25)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(0,0,r*0.82,0,Math.PI*2);
    ctx.stroke();

    // DISTORSIONE
    ctx.globalAlpha=0.15;
    ctx.beginPath();
    ctx.arc(r*0.08,-r*0.05,r*1.08,0,Math.PI*2);
    ctx.stroke();

    ctx.restore();
  }
}

function handleCollision(o0, o1){
  if(o0.intangible || o1.intangible) return;
  const dx=o1.x-o0.x, dy=o1.y-o0.y;
  const d=Math.hypot(dx,dy)||1;
  const minD=o0.r+o1.r;
  if(d>=minD) return;
  const nx=dx/d, ny=dy/d;
  const overlap=minD-d;
  o0.x-=nx*overlap*.5;
  o0.y-=ny*overlap*.5;
  o1.x+=nx*overlap*.5;
  o1.y+=ny*overlap*.5;
  const dot=o0.vx*nx+o0.vy*ny;
  o0.vx-=dot*nx*1.6;
  o0.vy-=dot*ny*1.6;
  const dot2=o1.vx*nx+o1.vy*ny;
  o1.vx-=dot2*nx*1.6;
  o1.vy-=dot2*ny*1.6;
  freezeT = 0.06;
  flashA = 0.3;
  doFlash('#fff', 0.3);
}

function drawArena(){
  // MODIFICA 8: Motion blur - RIMOSSO clearRect
  ctx.fillStyle='rgba(8,8,15,0.18)';
  ctx.fillRect(0,0,W,H);

  const grd = ctx.createLinearGradient(CX-AR, CY-AR*0.5, CX+AR, CY+AR*0.5);
  grd.addColorStop(0,'#1a0025');
  grd.addColorStop(0.5,'#3d0066');
  grd.addColorStop(1,'#1a0025');
  ctx.fillStyle=grd;
  ctx.beginPath();
  ctx.arc(CX,CY,AR,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle='#dd44ff';
  ctx.lineWidth=3;
  ctx.globalAlpha=0.6;
  ctx.shadowBlur=20;
  ctx.shadowColor='#dd44ff';
  ctx.beginPath(); ctx.arc(CX,CY,AR,0,Math.PI*2); ctx.stroke();
  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

let orbs=[];
function init(){
  orbs=[];
  const ox = AR*.5;
  orbs.push(new Orb(0, CX-ox, CY));
  orbs.push(new Orb(1, CX+ox, CY));
  orbs[0].vx= AR*.1; orbs[1].vx=-AR*.1;
}

let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const raw = Math.min(.033, (ts-last)/1000); last=ts;
  let dt=raw;
  if(freezeT>0){ freezeT-=raw; dt=raw*0.03; }
  if(evTimer>0){evTimer-=raw; if(evTimer<=0)evEl.style.opacity='0';}
  const [o0,o1]=orbs;
  o0.step(dt,o1);
  o1.step(dt,o0);
  handleCollision(o0,o1);
  drawArena(); // MODIFICA 8: ora c'è motion blur
  o0.draw();
  o1.draw();
  if(flashA>0){
    ctx.save();
    ctx.globalAlpha=flashA*0.5;
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
    flashA=Math.max(0, flashA-raw*8);
  }
}

init();
requestAnimationFrame(t=>{ last=t; loop(t); });
</script>
</body>
</html>
