<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Blackhole Arena</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}canvas{display:block}#ui{position:fixed;top:14px;left:14px;color:#fff;font-weight:800;text-shadow:0 0 12px #000;z-index:10}#ui div{margin-bottom:6px;background:rgba(0,0,0,.6);padding:7px 12px;border-radius:8px;font-size:15px}#winner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:900;text-shadow:0 0 20px #f0f;opacity:0;transition:.3s;z-index:20}</style>
</head>
<body>
<div id="ui"><div>BLACKHOLE ARENA ⚫</div><div id="alive"></div><div id="kills"></div><div id="streak"></div><div id="powers"></div></div>
<div id="winner"></div>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050010);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);
camera.position.set(0,10,10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// LUCI - FIX MOBILE
scene.add(new THREE.HemisphereLight(0x8844ff,0x220044,1.2));
const dl=new THREE.DirectionalLight(0xffffff,1);
dl.position.set(5,12,5);
scene.add(dl);

const world=new CANNON.World({gravity:new CANNON.Vec3(0,-25,0)});
const mat=new CANNON.Material();
world.defaultContactMaterial=new CANNON.ContactMaterial(mat,mat,{friction:0.05,restitution:0.85});

const half=6;
world.addBody(new CANNON.Body({mass:0,shape:new CANNON.Plane(),material:mat,quaternion:new CANNON.Quaternion().setFromEuler(-Math.PI/2,0,0)}));

// PAVIMENTO VISIBILE
const plane=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.MeshStandardMaterial({color:0x1a0033,emissive:0x6600aa,emissiveIntensity:.25}));
plane.rotation.x=-Math.PI/2;
scene.add(plane);

// MURI
[[0,6,6,.3],[0,-6,6,.3],[6,0,.3,6],[-6,0,.3,6]].forEach(([x,z,w,h])=>{
  const b=new CANNON.Body({mass:0,shape:new CANNON.Box(new CANNON.Vec3(w,h,2.5)),material:mat});
  b.position.set(x,2.5,z);
  world.addBody(b);
});

// BUCHE
const holes=[];
[[-5,5],[5,5],[5,-5],[-5,-5]].forEach(([x,z])=>{
  const r=new THREE.Mesh(new THREE.RingGeometry(1.2,1.6,32),new THREE.MeshBasicMaterial({color:0xaa00ff,transparent:1,opacity:.7,side:2}));
  r.position.set(x,.01,z);
  r.rotation.x=-Math.PI/2;
  scene.add(r);
  holes.push({x,z,r:1.3,mesh:r});
});

const colors=[0xff3355,0x3388ff,0x33ff77,0xbb44ff],
names=['ROSSA','BLU','VERDE','VIOLA'],
powers=['DASH','STORD','GIGANTE','CLONE'],
spawns=[[-4,4],[4,4],[4,-4],[-4,-4]];

const orbs=[],kills=[0,0,0,0],streak=[0,0,0,0];
let timer=0,slow=1;

function make(i,x,z){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.5,28,28),new THREE.MeshStandardMaterial({color:colors[i],emissive:colors[i],emissiveIntensity:.6}));
  m.position.set(x,1,z);
  scene.add(m);
  
  const b=new CANNON.Body({mass:2.5,shape:new CANNON.Sphere(.5),material:mat,linearDamping:.1});
  b.position.set(x,1,z);
  world.addBody(b);
  
  const t=new THREE.Line(new THREE.BufferGeometry().setAttribute('position',new THREE.BufferAttribute(new Float32Array(60*3),3)),new THREE.LineBasicMaterial({color:colors[i],transparent:1,opacity:.6}));
  scene.add(t);
  
  return {mesh:m,body:b,id:i,alive:1,power:i,cd:0,stun:0,giant:0,clone:null,cloneTime:0,dash:1+Math.random(),trail:t,ti:0,ai:Math.random()*.3};
}

spawns.forEach(([x,z],i)=>orbs.push(make(i,x,z)));

const ui={a:alive,k:kills,s:streak,p:powers,w:winner};

function win(id){
  ui.w.textContent=names[id]+' WINS!';
  ui.w.style.color='#'+colors[id].toString(16).padStart(6,'0');
  ui.w.style.opacity=1;
  setTimeout(()=>ui.w.style.opacity=0,2000);
}

function ai(o,dt){
  if(!o.alive||o.stun>0)return;
  if((o.ai-=dt)>0)return;
  o.ai=.2;
  
  const e=orbs.filter(p=>p.alive&&p!==o);
  if(!e.length)return;
  
  for(const h of holes){
    if(Math.hypot(o.body.position.x-h.x,o.body.position.z-h.z)<2.8){
      const d=new CANNON.Vec3(o.body.position.x-h.x,0,o.body.position.z-h.z).unit();
      o.body.velocity.x=d.x*12;
      o.body.velocity.z=d.z*12;
      return;
    }
  }
  
  let t=e.sort((a,b)=>o.body.position.distanceTo(a.body.position)-o.body.position.distanceTo(b.body.position))[0];
  if(Math.random()<.2)t=e[1]||t;
  
  const d=new CANNON.Vec3(t.body.position.x-o.body.position.x,0,t.body.position.z-o.body.position.z);
  const l=Math.hypot(d.x,d.z);
  if(l)d.scale(1/l,d);
  
  o.dash-=dt;
  if(o.dash<=0&&l<6){
    o.body.velocity.x=d.x*(o.giant?20:16);
    o.body.velocity.z=d.z*(o.giant?20:16);
    o.body.velocity.y=0.5;
    o.dash=2.5+Math.random();
  }else if(o.dash>1){
    o.body.velocity.x=d.x*(o.giant?4:6);
    o.body.velocity.z=d.z*(o.giant?4:6);
  }
  
  o.cd=Math.max(0,o.cd-dt);
  o.stun=Math.max(0,o.stun-dt);
}

function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.033,clock.getDelta())*slow;
  world.step(1/60,dt,3);
  
  holes.forEach(h=>h.mesh.rotation.z+=dt*2);
  
  orbs.forEach(o=>{
    if(o.alive){
      o.mesh.position.copy(o.body.position);
      ai(o,dt);
    }
  });
  
  const a=orbs.filter(o=>o.alive);
  ui.a.textContent='Vivi: '+a.length+'/4';
  renderer.render(scene,camera);
}

const clock=new THREE.Clock();
loop();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
