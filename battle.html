<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Orbo Battle</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#1a0a2e;font-family:sans-serif}
canvas{display:block}
#ui{position:fixed;top:12px;left:12px;color:#fff;font-weight:700;text-shadow:0 0 10px #000;z-index:10}
#ui div{margin-bottom:6px;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:6px;font-size:14px}
</style>
</head>
<body>
<div id="ui"><div>Orbo Battle ⚔️</div><div id="alive">Vivi: 4/4</div><div id="powers"></div></div>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a0a2e);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);camera.position.set(0,18,0);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9999ff,0x222244,1));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(5,10,5);scene.add(dl);

const world=new CANNON.World({gravity:new CANNON.Vec3(0,-20,0)});const mat=new CANNON.Material();world.defaultContactMaterial=new CANNON.ContactMaterial(mat,mat,{friction:.1,restitution:.7});

const planeGeo=new THREE.PlaneGeometry(20,20); // fix: era PloneGeometry
const planeMat=new THREE.MeshStandardMaterial({color:0x553377,roughness:.8});const plane=new THREE.Mesh(planeGeo,planeMat);plane.rotation.x=-Math.PI/2;scene.add(plane);
const planeBody=new CANNON.Body({mass:0,shape:new CANNON.Plane(),material:mat});planeBody.quaternion.setFromEuler(-Math.PI/2,0,0);world.addBody(planeBody);

// BUCHE
const holes=[]; [[-8,8], [8,8], [8,-8], [-8,-8]].forEach(([x,z])=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,.5,24),new THREE.MeshBasicMaterial({color:0x000}));m.position.set(x,-.26,z);scene.add(m);holes.push({x,z,r:1.5});});

// SFERE + POTERI
const colors=[0xff5555,0x5555ff,0x55ff55,0xaa55ff];
const powerNames=['TELETRASPORTO','STORDIMENTO','GIGANTE','CLONE'];
const spawns=[[-7,7],[7,7],[7,-7],[-7,-7]];
const orbs=[];

spawns.forEach(([x,z],i)=>{
  const R=.5;
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(R,24,24),new THREE.MeshStandardMaterial({color:colors[i],emissive:colors[i],emissiveIntensity:.3}));
  mesh.position.set(x,1,z);scene.add(mesh);
  const body=new CANNON.Body({mass:1,shape:new CANNON.Sphere(R),material:mat,linearDamping:.15});
  body.position.set(x,1,z);world.addBody(body);
  orbs.push({
    mesh,body,R,baseR:R,id:i,alive:true,
    power:i, // potere iniziale
    powerCd:0,stunned:0,isGiant:false,clone:null,cloneTime:0
  });
});

const aliveUI=document.getElementById('alive');
const powersUI=document.getElementById('powers');

// AI INTELLIGENTE
function botAI(o,dt){
  if(!o.alive||o.stunned>0)return;

  const enemies=orbs.filter(p=>p.alive&&p!==o);
  if(enemies.length===0)return;

  // 1. SOPRAVVIVENZA: scappa dalle buche
  for(let h of holes){
    const dHole=Math.hypot(o.body.position.x-h.x,o.body.position.z-h.z);
    if(dHole<h.r+2){
      const escape=new CANNON.Vec3(o.body.position.x-h.x,0,o.body.position.z-h.z);
      escape.normalize();
      o.body.velocity.x=escape.x*8;
      o.body.velocity.z=escape.z*8;
      return;
    }
  }

  // 2. SCEGLI TARGET: quello più vicino e con potere "debole" ora
  let target=enemies.sort((a,b)=>o.body.position.distanceTo(a.body.position)-o.body.position.distanceTo(b.body.position))[0];

  // 3. MUOVITI
  const dir=new CANNON.Vec3(target.body.position.x-o.body.position.x,0,target.body.position.z-o.body.position.z);
  const d=Math.hypot(dir.x,dir.z);
  if(d>1.5){
    dir.normalize();
    const speed=o.isGiant?6:8;
    o.body.velocity.x=dir.x*speed;
    o.body.velocity.z=dir.z*speed;
  }

  // 4. USA POTERE INTELLIGENTEMENTE
  if(o.powerCd<=0){
    if(o.power===0 && d>5){ // Teletrasporto: scappa o flanka
      o.body.position.x+=dir.x*4;
      o.body.position.z+=dir.z*4;
      o.powerCd=5;
      o.mesh.material.emissiveIntensity=1;
      setTimeout(()=>o.mesh.material.emissiveIntensity=.3,200);
    }

    if(o.power===1 && d<6){ // Stordimento: usa se nemico vicino
      enemies.forEach(p=>{
        if(p.alive&&o.body.position.distanceTo(p.body.position)<6)p.stunned=0.8;
      });
      o.powerCd=6;
    }

    if(o.power===2 && d<3){ // Gigante: usa in mischia
      o.isGiant=true;o.mesh.scale.setScalar(2);o.body.shapes[0].radius=o.R*2;o.body.updateBoundingRadius();
      o.powerCd=8;
      setTimeout(()=>{o.isGiant=false;o.mesh.scale.setScalar(1);o.body.shapes[0].radius=o.R;o.body.updateBoundingRadius();},3000);
    }

    if(o.power===3 && Math.random()<0.02){ // Clone: spam ogni tanto
      const c=o.mesh.clone();c.material=c.material.clone();c.material.opacity=.5;c.material.transparent=true;scene.add(c);
      o.clone=c;o.cloneTime=4;o.powerCd=7;
    }
  }

  // 5. GESTISCI CLONE
  if(o.clone){
    o.cloneTime-=dt;
    o.clone.position.copy(o.mesh.position).add(new THREE.Vector3(Math.sin(performance.now()*.005)*1.5,0,Math.cos(performance.now()*.005)*1.5));
    if(o.cloneTime<=0){scene.remove(o.clone);o.clone=null;}

    // Clone scompare se toccato
    enemies.forEach(p=>{
      if(p.alive&&o.clone&&o.clone.position.distanceTo(p.body.position)<p.R+0.5){
        scene.remove(o.clone);o.clone=null;
      }
    });
  }
}

function checkHoles(){
  orbs.forEach(o=>{
    if(!o.alive)return;
    holes.forEach(h=>{
      const dx=o.body.position.x-h.x,dz=o.body.position.z-h.z;
      if(Math.hypot(dx,dz)<h.r&&o.body.position.y<0.5){
        // RUBA POTERE: dai il potere di o a chi l'ha spinta
        const killer=orbs.find(k=>k.alive&&k!==o&&k.body.position.distanceTo(o.body.position)<2);
        if(killer)killer.power=o.power;

        o.alive=false;o.mesh.visible=false;world.removeBody(o.body);
      }
    });
  });
}

const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.033);
  world.step(1/60,dt,3);

  orbs.forEach(o=>{
    if(o.alive){
      o.mesh.position.copy(o.body.position);
      o.powerCd=Math.max(0,o.powerCd-dt);
      o.stunned=Math.max(0,o.stunned-dt);
      if(o.stunned>0)o.body.velocity.scale(.1,o.body.velocity);
      botAI(o,dt);
    }
  });

  checkHoles();

  aliveUI.textContent=`Vivi: ${orbs.filter(o=>o.alive).length}/4`;
  powersUI.innerHTML=orbs.filter(o=>o.alive).map(o=>`${powerNames[o.power]} ${o.id+1}`).join('<br>');

  renderer.render(scene,camera);
}
tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
