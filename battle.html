<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Blackhole Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Orbitron',monospace}
canvas{display:block}

#ui{
  position:fixed;top:0;left:0;right:0;bottom:0;
  pointer-events:none;z-index:10;
}

#topbar{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;
  background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,transparent 100%);
}

#logo{
  font-size:22px;font-weight:900;letter-spacing:4px;
  color:#fff;text-shadow:0 0 20px #aa00ff,0 0 40px #aa00ff;
}

#round-badge{
  font-size:13px;letter-spacing:2px;color:#bb88ff;
  background:rgba(100,0,200,.25);border:1px solid rgba(180,80,255,.4);
  padding:6px 16px;border-radius:20px;
  font-family:'Share Tech Mono',monospace;
}

/* Scoreboard sidebar */
#scoreboard{
  position:absolute;top:80px;left:16px;
  display:flex;flex-direction:column;gap:8px;
}

.score-row{
  display:flex;align-items:center;gap:10px;
  background:rgba(0,0,0,.65);
  border-left:3px solid var(--c);
  border-radius:0 8px 8px 0;
  padding:8px 14px 8px 12px;
  backdrop-filter:blur(6px);
  transition:all .2s;
  min-width:160px;
}
.score-row.dead{ opacity:0.35; filter:grayscale(1); }
.score-dot{ width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c); flex-shrink:0; }
.score-name{ font-size:11px;font-weight:700;letter-spacing:2px;color:#fff;flex:1; }
.score-k{ font-size:13px;font-weight:900;color:var(--c);text-shadow:0 0 8px var(--c);min-width:20px;text-align:right; }
.score-streak{ font-size:9px;color:#ffcc00;letter-spacing:1px; }
.score-power{ font-size:9px;color:#aaa;letter-spacing:1px; }

/* Kill feed */
#killfeed{
  position:absolute;top:80px;right:16px;
  display:flex;flex-direction:column;gap:6px;
  align-items:flex-end;
}
.kf-item{
  font-size:11px;font-family:'Share Tech Mono',monospace;
  background:rgba(0,0,0,.75);
  padding:5px 12px;border-radius:6px;
  border-right:3px solid #fff;
  animation:kfIn .2s ease forwards;
  opacity:1;transition:opacity 1s;
}
@keyframes kfIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* Winner overlay */
#winner{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;
}
#winner-name{
  font-size:64px;font-weight:900;letter-spacing:6px;
  text-shadow:0 0 30px currentColor, 0 0 60px currentColor;
  line-height:1;
}
#winner-sub{
  font-size:14px;letter-spacing:8px;color:#fff;opacity:0.7;margin-top:8px;
  font-family:'Share Tech Mono',monospace;
}

/* Bottom stats */
#bottombar{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:40px;
  padding:14px 24px;
  background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,transparent 100%);
  font-family:'Share Tech Mono',monospace;font-size:11px;color:#888;
  letter-spacing:2px;
}
.stat-item span{ color:#cc88ff; }

/* Flash overlay */
#flash{
  position:absolute;inset:0;
  background:#fff;opacity:0;pointer-events:none;
  transition:opacity .05s;
}

/* Combo badge */
#combo{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:28px;font-weight:900;letter-spacing:4px;
  color:#ffcc00;text-shadow:0 0 20px #ffaa00;
  opacity:0;pointer-events:none;font-family:'Orbitron',monospace;
  animation:none;
}
</style>
</head>
<body>
<div id="ui">
  <div id="flash"></div>

  <div id="topbar">
    <div id="logo">⚫ BLACKHOLE ARENA</div>
    <div id="round-badge">ROUND <span id="round-num">1</span></div>
  </div>

  <div id="scoreboard"></div>
  <div id="killfeed"></div>
  <div id="winner"><div id="winner-name"></div><div id="winner-sub">WINS THIS ROUND</div></div>
  <div id="combo"></div>

  <div id="bottombar">
    <div class="stat-item">ALIVE <span id="alive-count">4/4</span></div>
    <div class="stat-item">ROUND <span id="round-stat">1</span></div>
    <div class="stat-item">ELIMINATIONS <span id="total-kills">0</span></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

/* ─── SCENE ─── */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020008);
scene.fog = new THREE.FogExp2(0x0d0022, 0.018);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 22, 22);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ─── LIGHTS ─── */
scene.add(new THREE.AmbientLight(0x220044, 1.5));
const hemi = new THREE.HemisphereLight(0x9955ff, 0x110022, 1.8);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(8,16,8); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.near=0.5; sun.shadow.camera.far=60;
sun.shadow.camera.left=sun.shadow.camera.bottom=-20;
sun.shadow.camera.right=sun.shadow.camera.top=20;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x4400aa, 0.6);
fill.position.set(-8,4,-8); scene.add(fill);

/* ─── STARS ─── */
const starGeo = new THREE.BufferGeometry();
const starCount = 1800;
const starPos = new Float32Array(starCount*3);
for(let i=0;i<starCount*3;i++) starPos[i] = (Math.random()-0.5)*300;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff,size:0.25,sizeAttenuation:true,transparent:true,opacity:0.7}));
scene.add(stars);

/* ─── PHYSICS ─── */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0,-28,0) });
const mat = new CANNON.Material('m');
world.defaultContactMaterial = new CANNON.ContactMaterial(mat, mat, { friction:0.04, restitution:0.85 });

const HALF = 7.5;

/* Floor */
const floorBody = new CANNON.Body({ mass:0, shape:new CANNON.Plane(), material:mat });
floorBody.quaternion.setFromEuler(-Math.PI/2,0,0);
world.addBody(floorBody);

/* Arena floor mesh */
const floorMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(HALF*2, HALF*2, 16,16),
  new THREE.MeshStandardMaterial({
    color:0x120025, emissive:0x5500aa, emissiveIntensity:0.3,
    metalness:0.7, roughness:0.15
  })
);
floorMesh.rotation.x=-Math.PI/2; floorMesh.receiveShadow=true; scene.add(floorMesh);

/* Grid lines on floor */
const gridHelper = new THREE.GridHelper(HALF*2, 8, 0x6600cc, 0x330066);
gridHelper.position.y=0.01; scene.add(gridHelper);

/* Glow plane underneath */
const glowFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(HALF*2+2, HALF*2+2),
  new THREE.MeshBasicMaterial({color:0x6600cc, transparent:true, opacity:0.08, side:THREE.DoubleSide})
);
glowFloor.rotation.x=-Math.PI/2; glowFloor.position.y=-0.1; scene.add(glowFloor);

/* Walls (invisible physics) */
const wallDefs = [
  {pos:[0, 3, HALF+0.2],   half:[HALF+0.2, 3, 0.2]},
  {pos:[0, 3, -(HALF+0.2)],half:[HALF+0.2, 3, 0.2]},
  {pos:[HALF+0.2, 3, 0],   half:[0.2, 3, HALF+0.2]},
  {pos:[-(HALF+0.2), 3, 0],half:[0.2, 3, HALF+0.2]},
];
wallDefs.forEach(({pos,half})=>{
  const b = new CANNON.Body({ mass:0, shape:new CANNON.Box(new CANNON.Vec3(...half)), material:mat });
  b.position.set(...pos); world.addBody(b);
});

/* Rim visuals */
const rimMat = new THREE.MeshStandardMaterial({color:0x8800dd, emissive:0xcc00ff, emissiveIntensity:0.9, metalness:0.9, roughness:0.1});
const rimH = 0.22;

const rimDefs = [
  {pos:[0, rimH/2, HALF],  rot:[0,0,0],         len:HALF*2},
  {pos:[0, rimH/2,-HALF],  rot:[0,0,0],         len:HALF*2},
  {pos:[HALF, rimH/2, 0],  rot:[0,Math.PI/2,0], len:HALF*2},
  {pos:[-HALF, rimH/2, 0], rot:[0,Math.PI/2,0], len:HALF*2},
];
rimDefs.forEach(({pos,rot,len})=>{
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(rimH,rimH,len,20), rimMat);
  rim.position.set(...pos); rim.rotation.set(...rot); rim.castShadow=true; scene.add(rim);
});
[[-HALF,HALF],[HALF,HALF],[HALF,-HALF],[-HALF,-HALF]].forEach(([x,z])=>{
  const corner = new THREE.Mesh(new THREE.SphereGeometry(rimH,16,16), rimMat);
  corner.position.set(x,rimH/2,z); scene.add(corner);
});

/* Subtle point lights on rim corners */
[[-HALF,HALF],[HALF,HALF],[HALF,-HALF],[-HALF,-HALF]].forEach(([x,z],i)=>{
  const pl = new THREE.PointLight(0xaa00ff, 1.2, 8);
  pl.position.set(x, 1.5, z); scene.add(pl);
});

/* Center vortex ring */
const vortexGeo = new THREE.TorusGeometry(1.2, 0.05, 12, 60);
const vortexMat = new THREE.MeshBasicMaterial({color:0xcc44ff, transparent:true, opacity:0.6});
const vortex = new THREE.Mesh(vortexGeo, vortexMat); vortex.rotation.x=Math.PI/2; scene.add(vortex);
const vortex2 = new THREE.Mesh(new THREE.TorusGeometry(2.2,0.03,8,60), new THREE.MeshBasicMaterial({color:0x8800aa,transparent:true,opacity:0.3}));
vortex2.rotation.x=Math.PI/2; scene.add(vortex2);

/* ─── ORBS CONFIG ─── */
const ORB_COLORS  = [0xff2244, 0x2266ff, 0x22ff66, 0xdd44ff];
const ORB_EMITS   = [0xff0033, 0x0044ff, 0x00ff44, 0xcc22ff];
const ORB_NAMES   = ['ROSSO','BLU','VERDE','VIOLA'];
const ORB_POWERS  = ['TELEPORT','SPEED','INVIS','CLONE'];
const ORB_SPAWNS  = [[-5,5],[5,-5],[-5,-5],[5,5]];

let round = 1;
const totalKills = [0,0,0,0];
const totalStreak = [0,0,0,0];
let orbs = [];
let timer = 0, slowMo = 1;
let winnerDeclared = false;

/* Particle pool */
const particles = [];

function hexStr(c){ return '#'+c.toString(16).padStart(6,'0'); }

/* ─── MAKE ORB ─── */
function makeOrb(i){
  const [sx,sz] = ORB_SPAWNS[i];

  /* Mesh with inner glow layer */
  const geo = new THREE.SphereGeometry(0.5, 32, 32);
  const meshMat = new THREE.MeshStandardMaterial({
    color: ORB_COLORS[i], emissive: ORB_EMITS[i],
    emissiveIntensity: 0.8, metalness: 0.2, roughness: 0.15
  });
  const mesh = new THREE.Mesh(geo, meshMat);
  mesh.castShadow = true; scene.add(mesh);

  /* Glow halo */
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(0.72, 16, 16),
    new THREE.MeshBasicMaterial({color: ORB_COLORS[i], transparent:true, opacity:0.12, side:THREE.BackSide})
  );
  mesh.add(halo);

  /* Point light attached */
  const light = new THREE.PointLight(ORB_COLORS[i], 1.2, 5);
  mesh.add(light);

  /* Name sprite (canvas texture) */
  const canvas = document.createElement('canvas');
  canvas.width=256; canvas.height=64;
  const ctx = canvas.getContext('2d');
  ctx.font='bold 40px Orbitron,monospace';
  ctx.fillStyle = hexStr(ORB_COLORS[i]);
  ctx.textAlign='center';
  ctx.fillText(ORB_NAMES[i], 128, 48);
  const tex = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sprite.scale.set(2.5,0.6,1); sprite.position.y=1.1; mesh.add(sprite);

  /* Trail */
  const TRAIL_LEN = 30;
  const trailPos = new Float32Array(TRAIL_LEN*3);
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos,3));
  const trailMesh = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({
    color: ORB_COLORS[i], transparent:true, opacity:0.55, linewidth:1
  }));
  scene.add(trailMesh);

  /* Physics */
  const body = new CANNON.Body({ mass:2.8, shape:new CANNON.Sphere(0.5), material:mat, linearDamping:0.08 });
  body.position.set(sx, 1, sz);
  body.velocity.set((Math.random()-0.5)*4, 0, (Math.random()-0.5)*4);
  world.addBody(body);

  return {
    mesh, body, trailMesh, light, id:i,
    alive:true,
    power: i,   // each orb has its unique power
    cd: 4 + Math.random()*3,
    stun: 0, buff:0, invis:0,
    dash: 1+Math.random()*1.5,
    trailPts: Array(TRAIL_LEN).fill(null).map(()=>new THREE.Vector3()),
    trailIdx: 0,
    ai_timer: Math.random()*0.25,
    personality: Math.random(), // 0=aggressive, 1=defensive
    target: null,
    name: ORB_NAMES[i],
    kills: 0, streak: 0,
  };
}

/* ─── SPAWN ROUND ─── */
function spawnRound(){
  orbs.forEach(o=>{
    world.removeBody(o.body);
    scene.remove(o.mesh);
    scene.remove(o.trailMesh);
  });
  orbs = ORB_SPAWNS.map((_,i)=>makeOrb(i));
  timer=0; slowMo=1; winnerDeclared=false;
  updateScoreboard();
}

/* ─── PARTICLES ─── */
function burst(pos, color, count=20){
  for(let i=0;i<count;i++){
    const geo = new THREE.SphereGeometry(0.06+Math.random()*0.1, 6,6);
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color, transparent:true, opacity:1}));
    const angle = Math.random()*Math.PI*2;
    const speed = 3+Math.random()*8;
    const vx=(Math.cos(angle)*speed), vy=(2+Math.random()*6), vz=(Math.sin(angle)*speed);
    m.position.copy(pos);
    scene.add(m);
    particles.push({mesh:m, vx,vy,vz, life:1, maxLife:1, decay:0.6+Math.random()*0.4});
  }
  /* ring flash */
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.1, 0.8, 24),
    new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.9, side:THREE.DoubleSide})
  );
  ring.position.copy(pos); ring.rotation.x=-Math.PI/2;
  scene.add(ring);
  particles.push({mesh:ring, isRing:true, vx:0,vy:0,vz:0, life:1, maxLife:1, decay:2.5, scale:1});
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life -= p.decay*dt;
    if(p.life<=0){ scene.remove(p.mesh); particles.splice(i,1); continue; }
    const t=p.life/p.maxLife;
    p.mesh.material.opacity = t*(p.isRing?0.9:0.85);
    if(p.isRing){
      const s=1+(1-t)*6; p.mesh.scale.set(s,s,1);
    } else {
      p.mesh.position.x+=p.vx*dt; p.mesh.position.y+=p.vy*dt; p.mesh.position.z+=p.vz*dt;
      p.vy-=12*dt;
    }
  }
}

/* ─── KILL FEED ─── */
const kfEl = document.getElementById('killfeed');
function addKillFeed(killerName, killerColor, victimName, victimColor){
  const div = document.createElement('div');
  div.className='kf-item';
  div.style.borderColor=hexStr(killerColor);
  div.innerHTML=`<span style="color:${hexStr(killerColor)}">${killerName}</span> <span style="color:#666">⊗</span> <span style="color:${hexStr(victimColor)}">${victimName}</span>`;
  kfEl.appendChild(div);
  setTimeout(()=>{ div.style.opacity='0'; setTimeout(()=>div.remove(),1100); }, 3000);
  while(kfEl.children.length>5) kfEl.removeChild(kfEl.firstChild);
}

/* ─── SCOREBOARD ─── */
const sbEl = document.getElementById('scoreboard');
function updateScoreboard(){
  sbEl.innerHTML = '';
  orbs.forEach(o=>{
    const row = document.createElement('div');
    row.className='score-row'+(o.alive?'':' dead');
    row.style.setProperty('--c', hexStr(ORB_COLORS[o.id]));
    const streakTxt = totalStreak[o.id]>1? `🔥×${totalStreak[o.id]} ` : '';
    const powerIco = o.buff>0?'⚡':o.invis>0?'👻':'';
    row.innerHTML=`
      <div class="score-dot"></div>
      <div>
        <div class="score-name">${o.name} ${powerIco}</div>
        <div class="score-power">${ORB_POWERS[o.power]}</div>
        ${streakTxt?`<div class="score-streak">${streakTxt}</div>`:''}
      </div>
      <div class="score-k">${totalKills[o.id]}</div>
    `;
    sbEl.appendChild(row);
  });
}

/* ─── AI ─── */
function aiStep(o, dt){
  if(!o.alive || o.stun>0){ o.body.velocity.scale(0.88, o.body.velocity); return; }
  o.ai_timer -= dt;
  if(o.ai_timer > 0) return;
  o.ai_timer = 0.12 + Math.random()*0.1;

  o.buff = Math.max(0, o.buff-dt);
  o.invis = Math.max(0, o.invis-dt);
  o.mesh.material.opacity = o.invis>0 ? 0.2 : 1;
  o.mesh.material.transparent = o.invis>0;

  const enemies = orbs.filter(p=>p.alive && p!==o && p.invis<=0);
  if(!enemies.length){ o.body.velocity.scale(0.85, o.body.velocity); return; }

  /* Find nearest */
  let target = enemies[0];
  let best = o.body.position.distanceTo(target.body.position);
  for(let k=1;k<enemies.length;k++){
    const d = o.body.position.distanceTo(enemies[k].body.position);
    if(d < best){ best=d; target=enemies[k]; }
  }

  /* Direction to target */
  const dx = target.body.position.x - o.body.position.x;
  const dz = target.body.position.z - o.body.position.z;
  let dist = Math.hypot(dx,dz);
  if(!isFinite(dist)||dist<0.001) dist=0.001;
  const inv=1/dist;
  const dirX=dx*inv, dirZ=dz*inv;

  /* Direction to center (avoid edges) */
  const cx=-o.body.position.x, cz=-o.body.position.z;
  const cDist=Math.hypot(cx,cz)||1;
  const toCX=cx/cDist, toCZ=cz/cDist;

  /* Edge avoidance weight */
  const edgeFactor = Math.max(0, (Math.max(Math.abs(o.body.position.x),Math.abs(o.body.position.z))-5)/(HALF-5));
  const mixX = dirX*(1-edgeFactor)+toCX*edgeFactor;
  const mixZ = dirZ*(1-edgeFactor)+toCZ*edgeFactor;

  /* Power cooldown */
  o.cd = Math.max(0, o.cd-dt);
  if(o.cd<=0){
    if(o.power===0){ // TELEPORT
      const ang=Math.random()*Math.PI*2, r=2+Math.random()*3;
      let nx=o.body.position.x+Math.cos(ang)*r, nz=o.body.position.z+Math.sin(ang)*r;
      const lim=HALF-0.8;
      nx=Math.max(-lim,Math.min(lim,nx)); nz=Math.max(-lim,Math.min(lim,nz));
      burst(o.body.position.clone(), ORB_COLORS[o.id], 8);
      o.body.position.set(nx,1,nz); o.body.velocity.set(0,0,0);
      o.cd=8;
    } else if(o.power===1){ // SPEED
      o.buff=3.5; o.cd=9;
    } else if(o.power===2){ // INVIS
      o.invis=4; o.cd=10;
    } else if(o.power===3){ // CLONE decoy
      const decoy=o.mesh.clone(); decoy.material=decoy.material.clone();
      decoy.material.opacity=0.35; decoy.material.transparent=true;
      decoy.position.copy(o.mesh.position);
      scene.add(decoy);
      let life=5;
      const removeDecoy=()=>{ scene.remove(decoy); };
      setTimeout(removeDecoy, 5000);
      o.cd=11;
    }
  }

  /* Movement */
  const speed = o.buff>0 ? 11 : 6.5;
  const dashPow = o.buff>0 ? 24 : 18;
  o.dash -= dt;

  if(o.dash<=0 && dist<7){
    o.body.velocity.x = dirX*dashPow;
    o.body.velocity.z = dirZ*dashPow;
    o.body.velocity.y = 0.4;
    o.dash = 2+Math.random()*1.5;
  } else {
    /* Slight wander to avoid predictability */
    const wander = (Math.random()-0.5)*0.5;
    o.body.velocity.x = (mixX+wander*0.3)*speed;
    o.body.velocity.z = (mixZ+wander*0.3)*speed;
  }
}

/* ─── WINNER DISPLAY ─── */
const winnerEl = document.getElementById('winner');
const winnerName = document.getElementById('winner-name');
const flashEl = document.getElementById('flash');

function showWinner(id){
  winnerName.textContent = ORB_NAMES[id]+' VINCE!';
  winnerName.style.color = hexStr(ORB_COLORS[id]);
  winnerEl.style.opacity='1';
  /* Flash */
  flashEl.style.opacity='0.7';
  setTimeout(()=>flashEl.style.opacity='0',120);
  slowMo=0.18;
}

/* ─── MAIN LOOP ─── */
const clock = new THREE.Clock();
let camAngle = 0;
let sbTimer = 0, roundNum = 1;

document.getElementById('round-num').textContent=roundNum;
document.getElementById('round-stat').textContent=roundNum;

spawnRound();

function loop(){
  requestAnimationFrame(loop);
  const rawDt = Math.min(0.033, clock.getDelta());
  const dt = rawDt * slowMo;

  world.step(1/60, dt, 3);

  /* Star rotation */
  stars.rotation.y += 0.00015;

  /* Vortex spin */
  vortex.rotation.z += 0.6*dt*(slowMo<1?slowMo*3:1);
  vortex2.rotation.z -= 0.3*dt;

  /* Camera orbit */
  camAngle += 0.006 * dt * 60;
  const camR = 24;
  camera.position.x = Math.sin(camAngle)*camR;
  camera.position.z = Math.cos(camAngle)*camR;
  camera.position.y = 18 + Math.sin(camAngle*0.4)*3;
  camera.lookAt(0,1,0);

  /* Update particles */
  updateParticles(rawDt);

  /* Update orbs */
  orbs.forEach(o=>{
    if(!o.alive) return;
    o.mesh.position.copy(o.body.position);
    o.mesh.rotation.y += dt*2;

    /* Trail update */
    o.trailPts[o.trailIdx].copy(o.body.position);
    o.trailPts[o.trailIdx].y += 0.05;
    o.trailIdx = (o.trailIdx+1) % o.trailPts.length;
    const arr = o.trailMesh.geometry.attributes.position.array;
    for(let t=0;t<o.trailPts.length;t++){
      arr[t*3]   = o.trailPts[t].x;
      arr[t*3+1] = o.trailPts[t].y;
      arr[t*3+2] = o.trailPts[t].z;
    }
    o.trailMesh.geometry.attributes.position.needsUpdate=true;

    aiStep(o, dt);
  });

  /* ─── ELIMINATION CHECK ─── */
  const toKill = [];
  orbs.forEach(o=>{
    if(!o.alive) return;
    const p = o.body.position;
    if(Math.abs(p.x)>HALF+1.2 || Math.abs(p.z)>HALF+1.2 || p.y<-2.5){
      /* Find credit */
      let killer = null;
      let minD = 5;
      orbs.forEach(k=>{
        if(!k.alive||k===o) return;
        const d=k.body.position.distanceTo(p);
        if(d<minD){ minD=d; killer=k; }
      });
      toKill.push({victim:o, killer});
    }
  });

  toKill.forEach(({victim, killer})=>{
    burst(victim.body.position.clone(), ORB_COLORS[victim.id], 28);
    victim.alive=false; victim.mesh.visible=false; victim.trailMesh.visible=false;
    world.removeBody(victim.body);
    if(killer){
      killer.kills++;
      totalKills[killer.id]++;
      addKillFeed(killer.name, ORB_COLORS[killer.id], victim.name, ORB_COLORS[victim.id]);
    }
    document.getElementById('total-kills').textContent = totalKills.reduce((a,b)=>a+b,0);
  });

  /* ─── ROUND END ─── */
  const alive = orbs.filter(o=>o.alive);
  document.getElementById('alive-count').textContent=`${alive.length}/4`;

  if(!winnerDeclared){
    if(alive.length===1){
      winnerDeclared=true;
      const w=alive[0];
      totalStreak[w.id]++;
      totalStreak.forEach((_,i)=>{ if(i!==w.id) totalStreak[i]=0; });
      showWinner(w.id);
    } else if(alive.length===0){
      winnerDeclared=true; slowMo=0.25;
    }
  }

  if(winnerDeclared){
    timer += rawDt;
    if(timer>3.5){
      winnerEl.style.opacity='0';
      roundNum++;
      document.getElementById('round-num').textContent=roundNum;
      document.getElementById('round-stat').textContent=roundNum;
      spawnRound();
    }
  }

  /* Scoreboard update */
  sbTimer += rawDt;
  if(sbTimer>0.25){ sbTimer=0; updateScoreboard(); }

  renderer.render(scene,camera);
}
loop();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
