<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Orbo Curioso - Finale</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #e8f4ff; touch-action: none; }
  canvas { display: block; }
  #label {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.9); padding: 8px 14px; border-radius: 12px;
    font-size: 12px; color: #334155; font-family: Inter, sans-serif;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body>
<div id="label">Orbo Curioso • esplora</div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e8f4ff');
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0xe8f4ff, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(10, 15, 10);
sun.castShadow = true;
scene.add(sun);

// Physics
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
const groundMat = new CANNON.Material('ground');
const orboMat = new CANNON.Material('orbo');
world.addContactMaterial(new CANNON.ContactMaterial(groundMat, orboMat, { friction: 0.005, restitution: 0.15 }));

const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: groundMat });
groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
world.addBody(groundBody);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ORBO
const orboRadius = 0.6;
const orboBody = new CANNON.Body({
  mass: 1, shape: new CANNON.Sphere(orboRadius), material: orboMat,
  position: new CANNON.Vec3(0, 2, 0), linearDamping: 0.02, angularDamping: 0.02
});
world.addBody(orboBody);

const orboTexture = new THREE.TextureLoader().load('orbo.png');
orboTexture.colorSpace = THREE.SRGBColorSpace;

const orbo = new THREE.Group();
const core = new THREE.Mesh(
  new THREE.SphereGeometry(orboRadius, 32, 32),
  new THREE.MeshStandardMaterial({ map: orboTexture, roughness: 0.4, emissive: 0x221100, emissiveIntensity: 0.05 })
);
core.castShadow = true;
orbo.add(core);

const eyes = new THREE.Group();
eyes.position.y = 0.15;
orbo.add(eyes);
const eyeGeo = new THREE.SphereGeometry(0.12, 16, 16);
const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111 });
const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
eyeL.position.set(-0.18, 0, 0.45);
eyeL.add(new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), pupilMat).translateZ(0.08));
const eyeR = eyeL.clone(); eyeR.position.x = 0.18;
eyes.add(eyeL, eyeR);
scene.add(orbo);

// AI CURIOSA VERA
const posti = [
  {x: 8, z: 8}, {x: -8, z: 8}, {x: 8, z: -8}, {x: -8, z: -8},
  {x: 0, z: 12}, {x: 12, z: 0}, {x: 0, z: -12}, {x: -12, z: 0}
];
let target = posti[0];
let state = 'esplora'; // esplora, pausa, guarda
let stateTime = 0;
const maxSpeed = 4; // MODIFICA 2: limite velocità

function updateAI(t, dt) {
  const pos = orboBody.position;
  const dx = target.x - pos.x;
  const dz = target.z - pos.z;
  const dist = Math.hypot(dx, dz);
  const speed = orboBody.velocity.length();

  if (state === 'esplora') {
    if (dist > 0.8) {
      const force = 3.5;
      orboBody.velocity.x = (dx/dist) * force;
      orboBody.velocity.z = (dz/dist) * force;
      const yaw = Math.atan2(dx, dz);
      eyes.rotation.y += (yaw - eyes.rotation.y) * 0.15;
    } else {
      state = 'pausa';
      stateTime = t + 0.5 + Math.random() * 1.0;
      orboBody.velocity.x *= 0.3;
      orboBody.velocity.z *= 0.3;
    }
  } else if (state === 'pausa') {
    orboBody.velocity.x *= 0.9;
    orboBody.velocity.z *= 0.9;
    eyes.rotation.y = Math.sin(t * 3) * 0.5;
    if (t > stateTime) {
      state = 'guarda';
      stateTime = t + 0.8;
    }
  } else if (state === 'guarda') {
    orboBody.angularVelocity.y = 2;
    eyes.rotation.y += 0.1;
    if (t > stateTime) {
      target = posti[Math.floor(Math.random() * posti.length)];
      state = 'esplora';
      orboBody.angularVelocity.y = 0;
    }
  }

  // Limite velocità - MODIFICA 2
  if (speed > maxSpeed) {
    orboBody.velocity.scale(maxSpeed / speed);
  }

  // rotolamento fisico
  orboBody.angularVelocity.x = -orboBody.velocity.z / orboRadius;
  orboBody.angularVelocity.z = orboBody.velocity.x / orboRadius;

  // pulsazione
  core.material.emissiveIntensity = 0.05 + Math.sin(t * 4) * 0.03 * Math.min(speed/3, 1);
}

// Loop
let lastTime = performance.now() / 1000;
const prevPos = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const t = performance.now() / 1000;
  const dt = Math.min(0.033, t - lastTime);
  lastTime = t;

  updateAI(t, dt);
  world.step(1/60, dt, 3);

  orbo.position.copy(orboBody.position);

  // MODIFICA 1: Rotolamento visivo realistico
  const delta = new THREE.Vector3(orboBody.position.x - prevPos.x, 0, orboBody.position.z - prevPos.z);
  if (delta.length() > 0.001) {
    const axis = new THREE.Vector3(-delta.z, 0, delta.x).normalize();
    const angle = delta.length() / orboRadius;
    core.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(axis, angle));
  }
  prevPos.copy(orboBody.position);

  // camera smooth
  const camTarget = new THREE.Vector3(orbo.position.x, 8, orbo.position.z + 12);
  camera.position.lerp(camTarget, 0.05);
  camera.lookAt(orbo.position.x, orbo.position.y + 0.5, orbo.position.z);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
