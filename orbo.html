<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbo Curioso</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #e8f4ff; }
  canvas { display: block; }
  #label {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.9); padding: 8px 14px; border-radius: 12px; font-size: 12px; color: #334155;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body>
<div id="label">Orbo Curioso</div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// --- Scene base ---
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e8f4ff');

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 12);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Luci semplici
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(10, 15, 10);
sun.castShadow = true;
scene.add(sun);

// --- Physics ---
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);

const groundMat = new CANNON.Material('ground');
const orboMat = new CANNON.Material('orbo');
world.addContactMaterial(new CANNON.ContactMaterial(groundMat, orboMat, {
  friction: 0.01,
  restitution: 0.2
}));

// Piano terra piatto
const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: groundMat });
groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
world.addBody(groundBody);

const groundMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 })
);
groundMesh.rotation.x = -Math.PI/2;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

// --- ORBO ---
const orboRadius = 0.6;

// Texture Orbo
const orboTexture = new THREE.TextureLoader().load('orbo.png');
orboTexture.colorSpace = THREE.SRGBColorSpace;

const orboBody = new CANNON.Body({
  mass: 1,
  shape: new CANNON.Sphere(orboRadius),
  material: orboMat,
  position: new CANNON.Vec3(0, 2, 0),
  linearDamping: 0.02,
  angularDamping: 0.02
});
world.addBody(orboBody);

const orbo = new THREE.Group();
const core = new THREE.Mesh(
  new THREE.SphereGeometry(orboRadius, 32, 32),
  new THREE.MeshStandardMaterial({
    map: orboTexture,
    roughness: 0.4,
    metalness: 0,
    emissive: 0x221100,
    emissiveIntensity: 0.05
  })
);
core.castShadow = true;
orbo.add(core);
scene.add(orbo);

// Occhi semplici
const eyes = new THREE.Group();
eyes.position.y = 0.15;
orbo.add(eyes);

const eyeGeo = new THREE.SphereGeometry(0.12, 16, 16);
const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111 });

const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
eyeL.position.set(-0.18, 0, 0.45);
const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), pupilMat);
pupilL.position.z = 0.08;
eyeL.add(pupilL);

const eyeR = eyeL.clone();
eyeR.position.x = 0.18;
const pupilR = eyeR.children[0];

eyes.add(eyeL, eyeR);

// --- AI Curiosa semplice ---
let target = new THREE.Vector2(0, 0);
let nextDecision = 0;

function updateAI(t) {
  if (t > nextDecision) {
    const angle = Math.random() * Math.PI * 2;
    const r = 3 + Math.random() * 5;
    target.set(Math.cos(angle) * r, Math.sin(angle) * r);
    nextDecision = t + 2 + Math.random() * 2;
  }

  const dx = target.x - orboBody.position.x;
  const dz = target.y - orboBody.position.z;
  const dist = Math.hypot(dx, dz);

  if (dist > 0.5) {
    orboBody.velocity.x = (dx/dist) * 3;
    orboBody.velocity.z = (dz/dist) * 3;
  }

  // Rotolamento realistico
  orboBody.angularVelocity.x = -orboBody.velocity.z / orboRadius;
  orboBody.angularVelocity.z = orboBody.velocity.x / orboRadius;

  // Pulsazione quando si muove
  const speed = orboBody.velocity.length();
  core.material.emissiveIntensity = 0.05 + Math.sin(t * 3) * 0.05 * (speed/3);

  // Occhi guardano dove va
  const lookDir = new THREE.Vector3(orboBody.velocity.x, 0, orboBody.velocity.z).normalize();
  if (lookDir.length() > 0.1) {
    const targetYaw = Math.atan2(lookDir.x, lookDir.z);
    eyes.rotation.y += (targetYaw - eyes.rotation.y) * 0.1;
  }
}

// --- Loop ---
let lastTime = performance.now() / 1000;
const prevPos = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const t = performance.now() / 1000;
  const dt = Math.min(0.033, t - lastTime);
  lastTime = t;

  updateAI(t);
  world.step(1/60, dt, 3);

  // Sync mesh con fisica
  orbo.position.copy(orboBody.position);

  // Rotazione visiva realistica
  const delta = new THREE.Vector3(
    orboBody.position.x - prevPos.x,
    0,
    orboBody.position.z - prevPos.z
  );
  const dist = delta.length();
  if (dist > 0.001) {
    const axis = new THREE.Vector3(-delta.z, 0, delta.x).normalize();
    const angle = dist / orboRadius;
    const dq = new THREE.Quaternion().setFromAxisAngle(axis, angle);
    core.quaternion.premultiply(dq);
  }
  prevPos.copy(orboBody.position);

  // Camera segue Orbo
  camera.position.x = orbo.position.x;
  camera.position.z = orbo.position.z + 12;
  camera.lookAt(orbo.position);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
